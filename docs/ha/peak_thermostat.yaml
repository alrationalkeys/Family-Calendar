# FamilyHub — Santee Cooper peak hours: HVAC OFF during peak, automatically, all year (Nov 2026)
#
# Santee Cooper peak, every day:  winter (Nov 1 – Mar 31) 6–9 AM,  summer (Apr 1 – Oct 31) 3–6 PM.
# Santee Cooper bills on DEMAND: one HVAC run during peak sets an expensive charge for the whole month
# (a 3-hour run last year cost more than the rest of the month). So during peak the heat and AC are OFF.
#
# HOW IT WORKS
#   1. An hour before peak (5 AM winter / 2 PM summer): PRE-HEAT to 70° or PRE-COOL to 68° while power is cheap,
#      so the house coasts through peak.
#   2. Peak start: remembers each thermostat's mode + settings, then turns both thermostats OFF.
#      (The Alarm.com schedule may still change setpoints during peak; with the system OFF nothing runs.)
#   3. Peak end: turns both back on in their saved mode, at the schedule's temps for that time of day
#      (winter 9 AM: heat 60 / cool 70; summer 6 PM: heat 67 / cool 70). The Alarm.com schedule carries on.
#   SAFETY ONLY: if the house ever reaches 50° (pipes) or 88° during peak, that thermostat comes back on at that
#   number until peak ends. Set either limit in Helpers. It should never happen in a normal South Carolina day.
#   Change any time or temperature in Home Assistant: Settings > Devices & services > Helpers > "Peak …".
#
# ALARM.COM SCHEDULE TO SET ONCE (both thermostats, weekday + weekend the same), then leave it alone:
#       Heat: 67° from 6 PM to 9 AM, 60° from 9 AM to 6 PM        (delete the 50° 3–6 PM block)
#       Cool: 70° all day                                          (delete the 85° 6–9 AM block)
#
# INSTALL: check the two thermostat entity IDs (Settings > Entities, search "thermostat"), put this file in
# /config/packages/, restart, then simplify the Alarm.com schedule as above.

input_datetime:
  peak_summer_start: { name: Peak summer start, has_date: false, has_time: true, initial: "15:00" }
  peak_summer_end:   { name: Peak summer end,   has_date: false, has_time: true, initial: "18:00" }
  peak_winter_start: { name: Peak winter start, has_date: false, has_time: true, initial: "06:00" }
  peak_winter_end:   { name: Peak winter end,   has_date: false, has_time: true, initial: "09:00" }

input_number:
  peak_preheat:   { name: Pre-heat before winter peak, min: 60, max: 76, step: 1, initial: 70, unit_of_measurement: "°F" }
  peak_precool:   { name: Pre-cool before summer peak, min: 64, max: 78, step: 1, initial: 68, unit_of_measurement: "°F" }
  # what the thermostats go back to when peak ends (= your Alarm.com schedule at that time of day)
  peak_after_winter_heat: { name: After winter peak heat (9 AM), min: 50, max: 75, step: 1, initial: 60, unit_of_measurement: "°F" }
  peak_after_winter_cool: { name: After winter peak cool (9 AM), min: 65, max: 90, step: 1, initial: 70, unit_of_measurement: "°F" }
  peak_after_summer_heat: { name: After summer peak heat (6 PM), min: 50, max: 75, step: 1, initial: 67, unit_of_measurement: "°F" }
  peak_after_summer_cool: { name: After summer peak cool (6 PM), min: 65, max: 90, step: 1, initial: 70, unit_of_measurement: "°F" }
  peak_safe_low:  { name: Peak safety floor (heat comes back on), min: 40, max: 60, step: 1, initial: 50, unit_of_measurement: "°F" }
  peak_safe_high: { name: Peak safety ceiling (AC comes back on), min: 80, max: 95, step: 1, initial: 88, unit_of_measurement: "°F" }

input_text:
  peak_saved: { name: Saved thermostat settings (automatic), max: 255 }

input_boolean:
  peak_enabled: { name: Peak hours - HVAC off, icon: mdi:transmission-tower, initial: true }
  peak_active:  { name: Peak in progress (automatic) }

template:
  - binary_sensor:
      - name: Peak summer season
        unique_id: fh_peak_summer_season
        state: "{{ 4 <= now().month <= 10 }}"
      - name: Santee Cooper peak now
        unique_id: fh_peak_now
        state: >
          {% set s = is_state('binary_sensor.peak_summer_season','on') %}
          {% set a = states('input_datetime.peak_summer_start' if s else 'input_datetime.peak_winter_start')[:5] %}
          {% set b = states('input_datetime.peak_summer_end' if s else 'input_datetime.peak_winter_end')[:5] %}
          {{ a <= now().strftime('%H:%M') < b }}

automation:
  - id: fh_peak_precondition
    alias: "Peak: pre-heat / pre-cool an hour before"
    triggers:
      - trigger: template
        value_template: >
          {% set st = states('input_datetime.peak_summer_start' if is_state('binary_sensor.peak_summer_season','on') else 'input_datetime.peak_winter_start') %}
          {{ now().strftime('%H:%M') == (today_at(st) - timedelta(hours=1)).strftime('%H:%M') }}
    conditions:
      - condition: state
        entity_id: input_boolean.peak_enabled
        state: "on"
    actions:
      - repeat:
          for_each: [climate.upstairs_thermostat, climate.downstairs_thermostat]
          sequence:
            - variables:
                summer: "{{ is_state('binary_sensor.peak_summer_season','on') }}"
                mode: "{{ states(repeat.item) }}"
            - choose:
                - conditions: "{{ mode in ['heat_cool','auto'] }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: >
                        {% if summer %}{"target_temp_low": {{ state_attr(repeat.item,'target_temp_low') or 60 }}, "target_temp_high": {{ states('input_number.peak_precool') }}}
                        {% else %}{"target_temp_low": {{ states('input_number.peak_preheat') }}, "target_temp_high": {{ [state_attr(repeat.item,'target_temp_high') or 75, (states('input_number.peak_preheat')|float) + 3] | max }}}{% endif %}
                - conditions: "{{ mode == 'heat' and not summer }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { temperature: "{{ states('input_number.peak_preheat') }}" }
                - conditions: "{{ mode == 'cool' and summer }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { temperature: "{{ states('input_number.peak_precool') }}" }

  - id: fh_peak_start
    alias: "Peak: HVAC off"
    triggers:
      - trigger: state
        entity_id: binary_sensor.santee_cooper_peak_now
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.peak_enabled
        state: "on"
    actions:
      # Save mode + the normal schedule temps (not the pre-heat/pre-cool) as JSON, then turn both off.
      - action: input_text.set_value
        target: { entity_id: input_text.peak_saved }
        data:
          value: >
            {% set ns = namespace(o={}) %}
            {% for e in ['climate.upstairs_thermostat','climate.downstairs_thermostat'] %}
              {% set ns.o = dict(ns.o, **{e.split('.')[1][:4]: [states(e), state_attr(e,'temperature'), state_attr(e,'target_temp_low'), state_attr(e,'target_temp_high')]}) %}
            {% endfor %}
            {{ ns.o | to_json }}
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.peak_active }
      - action: climate.set_hvac_mode
        target: { entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat] }
        data: { hvac_mode: "off" }

  - id: fh_peak_end
    alias: "Peak: HVAC back on"
    triggers:
      - trigger: state
        entity_id: binary_sensor.santee_cooper_peak_now
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.peak_active
        state: "on"
    actions:
      - repeat:
          for_each:
            - { e: climate.upstairs_thermostat, k: upst }
            - { e: climate.downstairs_thermostat, k: down }
          sequence:
            - variables:
                s: "{{ (states('input_text.peak_saved') | from_json)[repeat.item.k] }}"
            - variables:
                mode: "{{ s[0] if s[0] not in ['off','unavailable','unknown'] else 'heat_cool' }}"
                summer: "{{ is_state('binary_sensor.peak_summer_season','on') }}"
                h: "{{ states('input_number.peak_after_summer_heat' if summer else 'input_number.peak_after_winter_heat') | float }}"
                c: "{{ states('input_number.peak_after_summer_cool' if summer else 'input_number.peak_after_winter_cool') | float }}"
            - action: climate.set_hvac_mode
              target: { entity_id: "{{ repeat.item.e }}" }
              data: { hvac_mode: "{{ mode }}" }
            - delay: { seconds: 5 }
            - choose:
                - conditions: "{{ mode in ['heat_cool','auto'] }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item.e }}" }
                      data: { target_temp_low: "{{ h }}", target_temp_high: "{{ c }}" }
                - conditions: "{{ mode == 'heat' }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item.e }}" }
                      data: { temperature: "{{ h }}" }
                - conditions: "{{ mode == 'cool' }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item.e }}" }
                      data: { temperature: "{{ c }}" }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.peak_active }

  # Safety only — pipes / extreme heat. Should never fire on a normal day.
  - id: fh_peak_safety
    alias: "Peak: safety limit reached, turn that thermostat back on"
    triggers:
      - trigger: numeric_state
        entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat]
        attribute: current_temperature
        below: input_number.peak_safe_low
      - trigger: numeric_state
        entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat]
        attribute: current_temperature
        above: input_number.peak_safe_high
    conditions:
      - condition: state
        entity_id: input_boolean.peak_active
        state: "on"
    actions:
      - variables:
          cold: "{{ (state_attr(trigger.entity_id,'current_temperature')|float) < (states('input_number.peak_safe_low')|float) }}"
      - action: climate.set_hvac_mode
        target: { entity_id: "{{ trigger.entity_id }}" }
        data: { hvac_mode: "{{ 'heat' if cold else 'cool' }}" }
      - action: climate.set_temperature
        target: { entity_id: "{{ trigger.entity_id }}" }
        data: { temperature: "{{ states('input_number.peak_safe_low') if cold else states('input_number.peak_safe_high') }}" }
