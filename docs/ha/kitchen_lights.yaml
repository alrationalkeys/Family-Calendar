# FamilyHub — kitchen + back patio lights, rebuilt from the Alexa routines (Nov 2026)
#
# EVERYTHING HERE IS CHANGEABLE WITHOUT EDITING THIS FILE: phone > FamilyHub > Settings > Automations:
#   which lights are the uppers / lowers / patio (pick from a list), every time, the brightness levels,
#   the night windows for motion, and how many quiet minutes before the lights go off.
# Starting values (the old Alexa routines) are filled in once on the first start; after that your changes are kept.
#
# INSTALL (once the four GLEDOPTO controllers and the Aqara motion sensor are paired to the Zigbee stick):
#   1. Rename the motion sensor's entity to  binary_sensor.kitchen_motion  (entity > gear > Entity ID).
#      The lights can have any name: pick them in FamilyHub afterwards (starting picks: light.fridge_upper,
#      light.stove_upper, light.fridge_lower, light.stove_lower, light.back_patio).
#   2. Put this file in the packages folder (/homeassistant/packages in the Terminal add-on) and restart.
#   3. Turn the matching Alexa routines OFF (don't delete yet) so the two systems don't fight.

input_boolean:
  fh_kitchen_ready: { name: Kitchen starting values filled in (automatic) }

input_text:
  fh_kitchen_upper_lights: { name: Kitchen upper lights, max: 255 }
  fh_kitchen_lower_lights: { name: Kitchen lower lights, max: 255 }
  fh_kitchen_patio_lights: { name: Back patio lights, max: 255 }

input_datetime:
  fh_kitchen_evening_on:   { name: Uppers + patio on at, has_date: false, has_time: true }
  fh_kitchen_patio_off:    { name: Patio off at, has_date: false, has_time: true }
  fh_kitchen_uppers_off:   { name: Uppers off at, has_date: false, has_time: true }
  fh_kitchen_morning_off:  { name: Everything off in the morning at, has_date: false, has_time: true }
  fh_kitchen_upper_motion_from:  { name: Uppers come on with motion from, has_date: false, has_time: true }
  fh_kitchen_lower_motion_from:  { name: Lowers come on with motion from, has_date: false, has_time: true }
  fh_kitchen_motion_until:       { name: Motion night-light until, has_date: false, has_time: true }

input_number:
  fh_kitchen_evening_bright: { name: Evening uppers brightness, min: 1, max: 100, step: 1, unit_of_measurement: "%", mode: box }
  fh_kitchen_motion_bright:  { name: Night-light brightness, min: 1, max: 100, step: 1, unit_of_measurement: "%", mode: box }
  fh_kitchen_quiet_minutes:  { name: Off after this many quiet minutes, min: 1, max: 60, step: 1, unit_of_measurement: min, mode: box }

script:
  # Turn every light listed in one of the lists above on (at a brightness, warm or cool white) or off.
  fh_kitchen_set:
    alias: Kitchen lights - turn a list on or off
    mode: parallel
    fields:
      lists: { description: "list of input_text helpers" }
      turn_on: { description: "true = on, false = off" }
      brightness: { description: "percent (default 100)" }
      kelvin: { description: "colour temperature, 2700 warm - 5000 cool (default 2700)" }
    sequence:
      - variables:
          ids: >
            {% set ns = namespace(o=[]) %}
            {% for l in (lists if lists is list else [lists]) %}
              {% set ns.o = ns.o + (states(l).split(',') | map('trim') | select('match', '^(light|switch)\\.') | list) %}
            {% endfor %}
            {{ ns.o }}
      - condition: template
        value_template: "{{ ids | count > 0 }}"
      - if: "{{ turn_on }}"
        then:
          - if: "{{ ids | select('match', '^light\\.') | list | count > 0 }}"
            then:
              - action: light.turn_on
                target: { entity_id: "{{ ids | select('match', '^light\\.') | list }}" }
                data:
                  brightness_pct: "{{ brightness | default(100, true) | int(100) }}"
                  color_temp_kelvin: "{{ kelvin | default(2700, true) | int(2700) }}"
          - if: "{{ ids | select('match', '^switch\\.') | list | count > 0 }}"
            then:
              - action: homeassistant.turn_on
                target: { entity_id: "{{ ids | select('match', '^switch\\.') | list }}" }
        else:
          - action: homeassistant.turn_off
            target: { entity_id: "{{ ids }}" }

automation:
  # First start only: fill in the starting values (the old Alexa routines). After that your changes are kept.
  - id: fh_kitchen_defaults
    alias: "Kitchen: fill in starting values (first install only)"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: not
        conditions: [{ condition: state, entity_id: input_boolean.fh_kitchen_ready, state: "on" }]
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.fh_kitchen_upper_lights }
        data: { value: "light.fridge_upper,light.stove_upper" }
      - action: input_text.set_value
        target: { entity_id: input_text.fh_kitchen_lower_lights }
        data: { value: "light.fridge_lower,light.stove_lower" }
      - action: input_text.set_value
        target: { entity_id: input_text.fh_kitchen_patio_lights }
        data: { value: "light.back_patio" }
      - repeat:
          for_each:
            - { e: input_datetime.fh_kitchen_evening_on, t: "20:00:00" }
            - { e: input_datetime.fh_kitchen_patio_off, t: "21:45:00" }
            - { e: input_datetime.fh_kitchen_uppers_off, t: "00:00:00" }
            - { e: input_datetime.fh_kitchen_morning_off, t: "08:10:00" }
            - { e: input_datetime.fh_kitchen_upper_motion_from, t: "00:00:00" }
            - { e: input_datetime.fh_kitchen_lower_motion_from, t: "20:00:00" }
            - { e: input_datetime.fh_kitchen_motion_until, t: "08:00:00" }
          sequence:
            - action: input_datetime.set_datetime
              target: { entity_id: "{{ repeat.item.e }}" }
              data: { time: "{{ repeat.item.t }}" }
      - repeat:
          for_each:
            - { e: input_number.fh_kitchen_evening_bright, v: 10 }
            - { e: input_number.fh_kitchen_motion_bright, v: 20 }
            - { e: input_number.fh_kitchen_quiet_minutes, v: 10 }
          sequence:
            - action: input_number.set_value
              target: { entity_id: "{{ repeat.item.e }}" }
              data: { value: "{{ repeat.item.v }}" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.fh_kitchen_ready }

  - id: fh_kitchen_evening
    alias: "Kitchen: uppers + patio on in the evening"
    triggers:
      - trigger: time
        at: input_datetime.fh_kitchen_evening_on
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_upper_lights, turn_on: true, kelvin: 2700,
                brightness: "{{ states('input_number.fh_kitchen_evening_bright') | int(10) }}" }
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_patio_lights, turn_on: true, kelvin: 5000 }

  - id: fh_patio_off
    alias: "Patio: off at night"
    triggers:
      - trigger: time
        at: input_datetime.fh_kitchen_patio_off
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_patio_lights, turn_on: false }

  - id: fh_kitchen_uppers_midnight
    alias: "Kitchen: uppers off late"
    triggers:
      - trigger: time
        at: input_datetime.fh_kitchen_uppers_off
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_upper_lights, turn_on: false }

  - id: fh_kitchen_uppers_motion_on
    alias: "Kitchen: uppers on with motion overnight"
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: "on"
    conditions:
      - condition: time
        after: input_datetime.fh_kitchen_upper_motion_from
        before: input_datetime.fh_kitchen_motion_until
      - condition: template      # already on (someone turned them on): leave the brightness alone
        value_template: "{{ states('input_text.fh_kitchen_upper_lights').split(',') | map('trim') | select('is_state', 'on') | list | count == 0 }}"
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_upper_lights, turn_on: true, kelvin: 2700,
                brightness: "{{ states('input_number.fh_kitchen_motion_bright') | int(20) }}" }

  - id: fh_kitchen_uppers_motion_off
    alias: "Kitchen: uppers off when quiet overnight"
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: "off"
        for: { minutes: "{{ states('input_number.fh_kitchen_quiet_minutes') | int(10) }}" }
    conditions:
      - condition: time
        after: input_datetime.fh_kitchen_upper_motion_from
        before: input_datetime.fh_kitchen_motion_until
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_upper_lights, turn_on: false }

  - id: fh_kitchen_lowers_motion_on
    alias: "Kitchen: lowers on with motion at night"
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: "on"
    conditions:
      - condition: time
        after: input_datetime.fh_kitchen_lower_motion_from
        before: input_datetime.fh_kitchen_motion_until
      - condition: template      # already on (someone turned them on): leave the brightness alone
        value_template: "{{ states('input_text.fh_kitchen_lower_lights').split(',') | map('trim') | select('is_state', 'on') | list | count == 0 }}"
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_lower_lights, turn_on: true, kelvin: 2700,
                brightness: "{{ states('input_number.fh_kitchen_motion_bright') | int(20) }}" }

  - id: fh_kitchen_lowers_motion_off
    alias: "Kitchen: lowers off when quiet at night"
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion
        to: "off"
        for: { minutes: "{{ states('input_number.fh_kitchen_quiet_minutes') | int(10) }}" }
    conditions:
      - condition: time
        after: input_datetime.fh_kitchen_lower_motion_from
        before: input_datetime.fh_kitchen_motion_until
    actions:
      - action: script.fh_kitchen_set
        data: { lists: input_text.fh_kitchen_lower_lights, turn_on: false }

  - id: fh_kitchen_morning_off
    alias: "Kitchen: everything off in the morning"
    triggers:
      - trigger: time
        at: input_datetime.fh_kitchen_morning_off
    actions:
      - action: script.fh_kitchen_set
        data: { lists: [input_text.fh_kitchen_upper_lights, input_text.fh_kitchen_lower_lights], turn_on: false }
