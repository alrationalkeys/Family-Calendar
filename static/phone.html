<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="/manifest.json">
<title>FamilyHub</title>
<style>
  :root{ --good:#5cb88a; --font:"Inter","Segoe UI",system-ui,sans-serif; }
  html[data-theme="dark"]{
    --bg:#14171c; --panel:#1b1f26; --panel2:#222834; --line:#2b313b;
    --ink:#ece6da; --ink-dim:#8a8f99; --now:#e9a23b;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#e2e5ea;
    --ink:#1d2430; --ink-dim:#6b7280; --now:#e9a23b;
  }
  html[data-theme="soft"]{
    --bg:#f7f3ec; --panel:#fffdf8; --panel2:#f1ece1; --line:#ece5d8;
    --ink:#3b342b; --ink-dim:#8c8478; --now:#e8a04a;
  }
  html{ --bg:#f4f5f7; --panel:#fff; --panel2:#eef0f3; --line:#e2e5ea; --ink:#1d2430; --ink-dim:#6b7280; --now:#e9a23b; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-appearance:none}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:var(--font);
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    -webkit-font-smoothing:antialiased;
  }
  h1{font-size:24px; font-weight:700; padding:20px 0 4px}
  .sub{color:var(--ink-dim); font-size:14px; margin-bottom:20px}

  /* magic box */
  .magic{background:var(--panel); border-radius:16px; padding:16px; margin-bottom:22px; border:1px solid var(--line)}
  .magic label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); font-weight:600}
  .magic textarea{
    width:100%; background:var(--panel2); border:0; border-radius:12px; color:var(--ink);
    font:inherit; font-size:17px; padding:14px; margin-top:10px; resize:none; min-height:58px;
  }
  .magic textarea::placeholder{color:var(--ink-dim)}
  .magic .hint{font-size:13px; color:var(--ink-dim); margin-top:8px; line-height:1.4}
  .magic-tools{display:flex; gap:8px; margin-top:10px}
  .tool{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    font:inherit; font-size:14px; font-weight:600; padding:11px; border-radius:10px; cursor:pointer}
  .tool:active{transform:scale(.98)}
  .tool.rec{background:#e0533d; color:#fff; border-color:#e0533d}

  /* color picker row */
  .colors{display:flex; gap:10px; margin:14px 0 4px; flex-wrap:wrap}
  .swatch{width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:.12s}
  .swatch.sel{border-color:var(--ink); transform:scale(1.1)}

  button.go{
    width:100%; background:var(--now); color:#1a1205; border:0; border-radius:12px;
    font:inherit; font-size:17px; font-weight:700; padding:15px; margin-top:14px; cursor:pointer;
  }
  button.go:active{transform:scale(.99)}
  button.go:disabled{opacity:.5}

  /* quick add tabs for manual entry */
  .seg{display:flex; gap:6px; background:var(--panel); border-radius:12px; padding:5px; margin-bottom:16px}
  .seg button{flex:1; background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px; font-weight:600;
    padding:11px 0; border-radius:9px; cursor:pointer}
  .seg button.active{background:var(--panel2); color:var(--ink)}

  .form{background:var(--panel); border-radius:16px; padding:16px; border:1px solid var(--line)}
  .form input, .form select{
    width:100%; background:var(--panel2); border:0; border-radius:10px; color:var(--ink);
    font:inherit; font-size:16px; padding:13px; margin-bottom:11px;
  }
  .form .two{display:flex; gap:10px}
  .form .two>*{flex:1}
  .chk{display:flex; align-items:center; gap:10px; font-size:16px; margin-bottom:11px; cursor:pointer; color:var(--ink)}
  .chk input{width:22px; height:22px; margin:0; accent-color:var(--now); -webkit-appearance:auto}
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 16px);
    background:var(--good); color:#06210f; font-weight:600; padding:14px 18px; border-radius:12px;
    text-align:center; transform:translateY(160%); transition:transform .3s; z-index:10;
  }
  .toast.show{transform:translateY(0)}
  .preview{background:var(--panel2); border-radius:10px; padding:12px; margin-top:12px; font-size:14px; display:none}
  .preview.show{display:block}
  .preview .pk{color:var(--now); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.1em}
  .preview .pi{padding:5px 0; border-top:1px solid var(--line)}
  .preview .pi:first-of-type{border-top:0; margin-top:6px}

  /* top nav: Add | Settings */
  .topnav{display:flex; gap:6px; background:var(--panel); border-radius:12px; padding:5px; margin:14px 0 18px; border:1px solid var(--line)}
  .topnav button{flex:1; background:none; border:0; color:var(--ink-dim); font:inherit; font-size:15px; font-weight:600; padding:12px 0; border-radius:9px; cursor:pointer}
  .topnav button.active{background:var(--panel2); color:var(--ink)}
  /* settings */
  .sect{margin-bottom:16px}
  .sect h2{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-dim); margin-bottom:12px}
  .srow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:13px}
  .srow>span{font-size:16px}
  .srow select{width:auto; margin:0; min-width:140px}
  .srow label{font-size:12px; color:var(--ink-dim)}
  .pill-toggle{display:flex; gap:4px; background:var(--panel2); border-radius:9px; padding:3px}
  .pill-toggle button{background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px; padding:8px 16px; border-radius:7px; cursor:pointer}
  .pill-toggle button.active{background:var(--now); color:#1a1205; font-weight:600}
  .sect hr{border:0; border-top:1px solid var(--line); margin:12px 0}
  .prow{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--line)}
  .prow:first-child{border-top:0}
  .prow .pav{width:30px; height:30px; border-radius:50%; flex:none; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px}
  .prow .pname{flex:1; font-size:16px}
  .prow button{background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); border-radius:8px; padding:7px 11px; font:inherit; font-size:13px; cursor:pointer}
  .prow button.del{color:#e0533d}
</style>
</head>
<body>
<h1>FamilyHub</h1>
<div class="topnav">
  <button id="nav-add" class="active">&#10133; Add</button>
  <button id="nav-settings">&#9881;&#65039; Settings</button>
</div>

<div id="view-add">
<div class="sub">Type it however you'd say it.</div>

<!-- THE MAGIC BOX -->
<div class="magic">
  <label>Quick add</label>
  <textarea id="magic" placeholder="dentist thursday 4pm&#10;milk, eggs, bread&#10;remind me to call mom&#10;tacos for dinner friday"></textarea>
  <div class="magic-tools">
    <button class="tool" id="micBtn" title="Speak">&#127908; Speak</button>
    <button class="tool" id="camBtn" title="Photo of a flyer">&#128247; Photo</button>
    <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
  </div>
  <div class="colors" id="magicColors"></div>
  <div class="hint" id="hint">It'll figure out if it's an event, to-do, grocery, or meal.</div>
  <div class="preview" id="preview"></div>
  <button class="go" id="magicGo">Add it</button>
</div>

<!-- MANUAL BACKUP -->
<div class="seg">
  <button data-f="event" class="active">Event</button>
  <button data-f="chore">Chore</button>
  <button data-f="todo">To-do</button>
  <button data-f="grocery">Grocery</button>
  <button data-f="meal">Meal</button>
</div>

<div class="form" id="form"></div>
</div><!-- /view-add -->

<div id="view-settings" hidden>
  <div class="sub">Changes apply to the wall display and this phone.</div>

  <div class="form sect">
    <h2>Appearance</h2>
    <div class="srow"><span>Theme</span>
      <div class="pill-toggle" id="set-theme">
        <button data-v="light">Light</button><button data-v="soft">Soft</button><button data-v="dark">Dark</button>
      </div>
    </div>
    <div class="srow"><span>Accent</span><div class="colors" id="set-accent" style="margin:0; justify-content:flex-end"></div></div>
    <div class="srow"><span>Font</span>
      <select id="set-font"><option value="inter">Default</option><option value="serif">Serif</option><option value="rounded">Rounded</option><option value="mono">Mono</option></select>
    </div>
    <div class="srow"><span>Density</span>
      <select id="set-density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="spacious">Spacious</option></select>
    </div>
    <div class="srow"><span>Text size</span>
      <select id="set-textsize"><option value="normal">Normal</option><option value="large">Large</option></select>
    </div>
  </div>

  <div class="form sect">
    <h2>Wall side panels</h2>
    <label class="chk"><input type="checkbox" data-panel="scoreboard"> Scoreboard</label>
    <label class="chk"><input type="checkbox" data-panel="todos"> To-Do</label>
    <label class="chk"><input type="checkbox" data-panel="groceries"> Groceries</label>
    <label class="chk"><input type="checkbox" data-panel="meals"> Today's meals</label>
    <hr>
    <label class="chk"><input type="checkbox" id="set-kbd"> On-screen keyboard on the wall</label>
  </div>

  <div class="form sect">
    <h2>Holidays</h2>
    <label class="chk"><input type="checkbox" data-hol="us_federal"> US federal holidays</label>
    <label class="chk"><input type="checkbox" data-hol="christian"> Christian holidays</label>
    <label class="chk"><input type="checkbox" data-hol="jewish"> Jewish holidays</label>
    <label class="chk"><input type="checkbox" data-hol="observances"> Fun observances</label>
  </div>

  <div class="form sect">
    <h2>Seasonal effects</h2>
    <label class="chk"><input type="checkbox" id="set-effects"> Enable seasonal effects</label>
    <label class="chk"><input type="checkbox" id="set-weatherfx"> Match the live weather (rain/snow/fog)</label>
    <hr>
    <label class="chk"><input type="checkbox" data-eff="snow"> Snow (winter)</label>
    <label class="chk"><input type="checkbox" data-eff="fireworks"> Fireworks (July 4 / NYE)</label>
    <label class="chk"><input type="checkbox" data-eff="halloween"> Halloween</label>
    <label class="chk"><input type="checkbox" data-eff="petals"> Spring petals</label>
  </div>

  <div class="form sect">
    <h2>Night screen-off</h2>
    <label class="chk"><input type="checkbox" id="disp-enabled"> Turn the wall screen off at night</label>
    <div class="srow"><span>Off at</span><input id="disp-start" type="time" style="width:auto; margin:0"></div>
    <div class="srow"><span>Back on</span><input id="disp-end" type="time" style="width:auto; margin:0"></div>
  </div>

  <div class="form sect">
    <h2>Family members</h2>
    <div id="people-list"></div>
    <hr>
    <input id="person-name" placeholder="New person's name">
    <div class="colors" id="person-colors"></div>
    <button class="go" id="person-add">Add person</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/auth.js"></script>
<script src="/theme.js"></script>
<script>
const $ = s => document.querySelector(s);
const PALETTE = ["#4f86c6","#d96b8a","#7c5cff","#5cb88a","#e9a23b","#e0533d","#3db5c9","#9aa0a6"];
let chosenColor = null, categories = [], people = [];

/* build color swatches */
function buildColors(el){
  el.innerHTML="";
  PALETTE.forEach(c=>{
    const s=document.createElement("div"); s.className="swatch"; s.style.background=c;
    s.onclick=()=>{ el.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel"));
      s.classList.add("sel"); chosenColor=c; };
    el.appendChild(s);
  });
}
buildColors($("#magicColors"));

/* toast */
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---- magic quick-add ---- */
let previewTimer;
$("#magic").addEventListener("input", ()=>{
  clearTimeout(previewTimer);
  const text=$("#magic").value.trim();
  if(text.length<4){ $("#preview").classList.remove("show"); return; }
  previewTimer=setTimeout(()=>preview(text), 700);
});

async function preview(text){
  try{
    const r=await fetch("/api/ai/route",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text})}).then(r=>r.json());
    const p=$("#preview");
    const items=(r.items||[]).map(it=>{
      const label=it.title||it.item||"";
      const extra=it.start?` · ${new Date(it.start).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})}`
        : it.slot?` · ${it.slot} ${it.date||""}` : it.qty?` · ${it.qty}`:"";
      return `<div class="pi">${label}${extra}</div>`;
    }).join("");
    p.innerHTML=`<div class="pk">${r.kind}</div>${items}`;
    p.classList.add("show");
  }catch(e){ $("#preview").classList.remove("show"); }
}

$("#magicGo").onclick=async()=>{
  const text=$("#magic").value.trim(); if(!text)return;
  $("#magicGo").disabled=true;
  try{
    const r=await fetch("/api/ai/quick-add",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,color:chosenColor})}).then(r=>r.json());
    // events come back as kind=event but aren't saved by quick-add; save them to calendar
    if(r.kind==="event"){
      for(const ev of r.created){
        await fetch("/api/calendar/events",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({title:ev.title,start:ev.start,end:ev.end||ev.start})}).catch(()=>{});
      }
    }
    toast(`Added to ${r.kind==="event"?"calendar":r.kind+"s"}`);
    $("#magic").value=""; $("#preview").classList.remove("show");
  }catch(e){ toast("Couldn't add — try the form below"); }
  $("#magicGo").disabled=false;
};

/* ---- manual forms ---- */
let formKind="event";
const today=new Date().toISOString().slice(0,10);

function catOptions(){
  return `<option value="">No category</option>`+
    categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
}

function peopleOptions(){
  return `<option value="">Unassigned</option>`+
    people.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
}
function recurOptions(){
  return ["","daily","weekly","monthly"].map(r=>
    `<option value="${r}">${r?r[0].toUpperCase()+r.slice(1):"No repeat"}</option>`).join("");
}
function starsOptions(){
  return `<option value="0">No stars</option>`+
    [1,2,3,4,5].map(s=>`<option value="${s}">${"⭐".repeat(s)}</option>`).join("");
}

function renderForm(){
  const f=$("#form");
  const colorRow=`<div class="colors" id="fColors"></div>`;
  if(formKind==="event"){
    f.innerHTML=`<input id="e_title" placeholder="Event title">
      <label class="chk"><input type="checkbox" id="e_allday" onchange="toggleAllDay()"> All day</label>
      <div class="two"><input id="e_date" type="date" value="${today}"><input id="e_time" type="time" value="09:00"></div>
      <select id="e_cat">${catOptions()}</select>${colorRow}
      <button class="go" onclick="saveEvent()">Add event</button>`;
  } else if(formKind==="chore"){
    f.innerHTML=`<input id="c_title" placeholder="Chore (e.g. Take out trash)">
      <div class="two"><select id="c_person">${peopleOptions()}</select><select id="c_stars">${starsOptions()}</select></div>
      <div class="two"><input id="c_due" type="date" value="${today}"><select id="c_recur">${recurOptions()}</select></div>
      <select id="c_cat">${catOptions()}</select>${colorRow}
      <button class="go" onclick="saveChore()">Add chore</button>`;
  } else if(formKind==="todo"){
    f.innerHTML=`<input id="t_title" placeholder="What needs doing?">
      <div class="two"><input id="t_due" type="date"><select id="t_recur">${recurOptions()}</select></div>
      <select id="t_cat">${catOptions()}</select>${colorRow}
      <button class="go" onclick="saveTodo()">Add to-do</button>`;
  } else if(formKind==="grocery"){
    f.innerHTML=`<div class="two"><input id="g_item" placeholder="Item" style="flex:2"><input id="g_qty" placeholder="Qty" style="flex:1"></div>
      <select id="g_cat">${catOptions()}</select>${colorRow}
      <button class="go" onclick="saveGrocery()">Add grocery</button>`;
  } else {
    f.innerHTML=`<input id="m_title" placeholder="Meal">
      <div class="two"><input id="m_date" type="date" value="${today}">
      <select id="m_slot"><option>breakfast</option><option>lunch</option><option selected>dinner</option><option>snack</option></select></div>
      <select id="m_cat">${catOptions()}</select>${colorRow}
      <button class="go" onclick="saveMeal()">Add meal</button>`;
  }
  buildColors($("#fColors"));
}

document.querySelectorAll(".seg button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); formKind=b.dataset.f; chosenColor=null; renderForm();
  };
});

function plusHourLocal(start){ // 1h later, kept in LOCAL time (no UTC shift)
  const d=new Date(new Date(start).getTime()+3600000), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`;
}
function nextDay(dateStr){ // YYYY-MM-DD -> next day (all-day end is exclusive in calendars)
  const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+1); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function toggleAllDay(){ $("#e_time").style.display = $("#e_allday").checked ? "none" : ""; }
async function saveEvent(){
  const title=$("#e_title").value.trim(); if(!title)return;
  const date=$("#e_date").value; if(!date){ toast("Pick a date"); return; }
  const allday=$("#e_allday").checked;
  let payload;
  if(allday){
    payload={title, start:date, end:nextDay(date), all_day:true};
  } else {
    const time=$("#e_time").value; if(!time){ toast("Pick a time"); return; }
    const start=`${date}T${time}:00`;
    payload={title, start, end:plusHourLocal(start)};
  }
  try{
    const r=await fetch("/api/calendar/events",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){ toast(data.detail||data.error||"Couldn't add event"); return; }
    toast(data.warning || (data.target==="local" ? "Event added" : "Event added to Google"));
    $("#e_title").value="";
  }catch(e){ toast("Couldn't reach the server"); }
}
async function saveChore(){
  const title=$("#c_title").value.trim(); if(!title)return;
  const r=await post("/api/chores/",{title, person_id:num($("#c_person").value),
    category_id:num($("#c_cat").value), color:chosenColor, due_date:$("#c_due").value||null,
    recurrence:$("#c_recur").value||null, stars:parseInt($("#c_stars").value)||0});
  if(!r.ok){ toast("Couldn't add chore"); return; }
  toast("Chore added"); $("#c_title").value="";
}
async function saveTodo(){
  const title=$("#t_title").value.trim(); if(!title)return;
  const r=await post("/api/todos/",{title, category_id:num($("#t_cat").value), color:chosenColor,
    due_date:$("#t_due").value||null, recurrence:$("#t_recur").value||null});
  if(!r.ok){ toast("Couldn't add to-do"); return; }
  toast("To-do added"); $("#t_title").value="";
}
async function saveGrocery(){
  const item=$("#g_item").value.trim(); if(!item)return;
  await post("/api/groceries/",{item,qty:$("#g_qty").value||null,category_id:num($("#g_cat").value),color:chosenColor});
  toast("Grocery added"); $("#g_item").value=""; $("#g_qty").value="";
}
async function saveMeal(){
  const title=$("#m_title").value.trim(); if(!title)return;
  await post("/api/meals/",{date:$("#m_date").value,slot:$("#m_slot").value,title,
    category_id:num($("#m_cat").value),color:chosenColor});
  toast("Meal added"); $("#m_title").value="";
}
function num(v){ return v?parseInt(v):null; }
function post(url,body){ return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }

/* boot */
/* ---- voice input (Web Speech API) ---- */
const micBtn = document.getElementById("micBtn");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  let listening = false;
  micBtn.onclick = () => {
    if (listening) { rec.stop(); return; }
    rec.start();
  };
  rec.onstart = () => { listening = true; micBtn.classList.add("rec"); micBtn.textContent = "● Listening"; };
  rec.onend = () => { listening = false; micBtn.classList.remove("rec"); micBtn.textContent = "🎤 Speak";
    const t = $("#magic").value.trim(); if (t.length >= 4) preview(t); };
  rec.onresult = (e) => {
    let txt = "";
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    $("#magic").value = txt;
  };
} else {
  micBtn.style.display = "none";  // browser doesn't support it
}

/* ---- vision: photo of a flyer -> events ---- */
const camBtn = document.getElementById("camBtn");
const camInput = document.getElementById("camInput");
camBtn.onclick = () => camInput.click();
camInput.onchange = async () => {
  const file = camInput.files[0]; if (!file) return;
  camBtn.textContent = "📷 Reading…"; camBtn.disabled = true;
  try {
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = rej; r.readAsDataURL(file);
    });
    const r = await fetch("/api/ai/vision", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({image_b64: b64, media_type: file.type || "image/jpeg"})}).then(r=>r.json());
    if (r.error) { toast(r.error); }
    else {
      const events = r.events || [];
      if (!events.length) { toast("No events found in photo"); }
      else {
        for (const ev of events) {
          await fetch("/api/calendar/events", {method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({title: ev.title, start: ev.start, end: ev.end || ev.start})}).catch(()=>{});
        }
        toast(`Added ${events.length} event${events.length>1?"s":""} from photo`);
      }
    }
  } catch (e) { toast("Couldn't read photo"); }
  camBtn.textContent = "📷 Photo"; camBtn.disabled = false; camInput.value = "";
};

/* ===================== SETTINGS VIEW ===================== */
/* top-nav view switch */
$("#nav-add").onclick=()=>switchView("add");
$("#nav-settings").onclick=()=>switchView("settings");
function switchView(v){
  const add=v==="add";
  $("#view-add").hidden=!add; $("#view-settings").hidden=add;
  $("#nav-add").classList.toggle("active",add);
  $("#nav-settings").classList.toggle("active",!add);
  if(!add){ loadSettingsUI(); loadDispCfg(); loadPeople(); }
}

function saveNested(group,key,val){
  const cur={...(FH.get()[group]||{})}; cur[key]=val; FH.save({[group]:cur});
}

/* accent + new-person color swatches */
let personColor=PALETTE[0];
function buildAccent(){
  const el=$("#set-accent"); el.innerHTML="";
  const cur=FH.get().accent;
  PALETTE.forEach(c=>{
    const s=document.createElement("div"); s.className="swatch"+(c===cur?" sel":""); s.style.background=c;
    s.onclick=()=>{ FH.save({accent:c}); buildAccent(); };
    el.appendChild(s);
  });
}
function buildPersonColors(){
  const el=$("#person-colors"); el.innerHTML="";
  PALETTE.forEach((c,i)=>{
    const s=document.createElement("div"); s.className="swatch"+(c===personColor?" sel":""); s.style.background=c;
    s.onclick=()=>{ personColor=c; buildPersonColors(); };
    el.appendChild(s);
  });
}

function loadSettingsUI(){
  const s=FH.get();
  // theme pill
  document.querySelectorAll("#set-theme button").forEach(b=>{
    b.classList.toggle("active", b.dataset.v===s.theme);
    b.onclick=()=>{ FH.save({theme:b.dataset.v}); loadSettingsUI(); };
  });
  buildAccent(); buildPersonColors();
  $("#set-font").value=s.font; $("#set-font").onchange=e=>FH.save({font:e.target.value});
  $("#set-density").value=s.density; $("#set-density").onchange=e=>FH.save({density:e.target.value});
  $("#set-textsize").value=s.textSize||"normal"; $("#set-textsize").onchange=e=>FH.save({textSize:e.target.value});
  // panels
  document.querySelectorAll("#view-settings input[data-panel]").forEach(c=>{
    c.checked=!!(s.panels||{})[c.dataset.panel];
    c.onchange=()=>saveNested("panels",c.dataset.panel,c.checked);
  });
  $("#set-kbd").checked=!!s.onscreenKbd; $("#set-kbd").onchange=e=>FH.save({onscreenKbd:e.target.checked});
  // holidays
  document.querySelectorAll("#view-settings input[data-hol]").forEach(c=>{
    c.checked=!!(s.holidays||{})[c.dataset.hol];
    c.onchange=()=>saveNested("holidays",c.dataset.hol,c.checked);
  });
  // effects
  $("#set-effects").checked=!!s.effects; $("#set-effects").onchange=e=>FH.save({effects:e.target.checked});
  $("#set-weatherfx").checked=s.weatherFx!==false; $("#set-weatherfx").onchange=e=>FH.save({weatherFx:e.target.checked});
  document.querySelectorAll("#view-settings input[data-eff]").forEach(c=>{
    c.checked=!!(s.effectPrefs||{})[c.dataset.eff];
    c.onchange=()=>saveNested("effectPrefs",c.dataset.eff,c.checked);
  });
}

/* night screen-off (shared endpoint with the wall) */
let dispCfg=null;
async function loadDispCfg(){
  try{ dispCfg=await fetch("/api/display/config").then(r=>r.json()); }catch(e){ dispCfg=null; return; }
  $("#disp-enabled").checked=!!dispCfg.enabled;
  $("#disp-start").value=dispCfg.off_start||"22:00";
  $("#disp-end").value=dispCfg.off_end||"06:30";
}
function saveDisp(){
  const patch={enabled:$("#disp-enabled").checked, off_start:$("#disp-start").value, off_end:$("#disp-end").value};
  fetch("/api/display/config",{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...(dispCfg||{}),...patch})}).then(r=>r.json()).then(c=>{dispCfg=c;}).catch(()=>{});
}
["disp-enabled","disp-start","disp-end"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=saveDisp; });

/* family members */
async function loadPeople(){
  let list=[];
  try{ list=await fetch("/api/categories/people").then(r=>r.json()); }catch(e){}
  people=list;
  const box=$("#people-list"); box.innerHTML="";
  if(!list.length){ box.innerHTML='<div class="sub" style="margin:0">No people yet — add your family below.</div>'; return; }
  list.forEach(p=>{
    const row=document.createElement("div"); row.className="prow";
    row.innerHTML=`<div class="pav" style="background:${p.color}">${(p.name||"?").slice(0,1).toUpperCase()}</div>`+
      `<div class="pname">${p.name}</div>`+
      `<button data-act="edit">Edit</button><button class="del" data-act="del">Delete</button>`;
    row.querySelector('[data-act="edit"]').onclick=()=>renamePerson(p);
    row.querySelector('[data-act="del"]').onclick=()=>deletePerson(p);
    box.appendChild(row);
  });
}
async function renamePerson(p){
  const name=prompt("Rename person:", p.name); if(name===null) return;
  const nm=name.trim(); if(!nm) return;
  await fetch("/api/categories/people/"+p.id,{method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:nm,color:p.color})}).catch(()=>{});
  toast("Saved"); loadPeople();
}
async function deletePerson(p){
  if(!confirm(`Remove ${p.name}? Their items become unassigned.`)) return;
  await fetch("/api/categories/people/"+p.id,{method:"DELETE"}).catch(()=>{});
  toast("Removed"); loadPeople();
}
$("#person-add").onclick=async()=>{
  const name=$("#person-name").value.trim(); if(!name){ toast("Enter a name"); return; }
  await fetch("/api/categories/people",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,color:personColor})}).catch(()=>{});
  $("#person-name").value=""; toast("Person added"); loadPeople();
};

async function init(){
  await FH.load();   // apply saved theme/accent/font
  try{ categories=await fetch("/api/categories/").then(r=>r.json()); }catch(e){ categories=[]; }
  try{ people=await fetch("/api/categories/people").then(r=>r.json()); }catch(e){ people=[]; }
  renderForm();
}
init();
</script>
