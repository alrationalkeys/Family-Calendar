<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FamilyHub</title>
<style>
  :root{
    --r:14px;
    --font:"Inter","Segoe UI",system-ui,sans-serif;
    --density:1;
  }
  html[data-theme="dark"]{
    --bg:#14171c; --panel:#1b1f26; --panel2:#222834; --line:#2b313b;
    --ink:#ece6da; --ink-dim:#8a8f99; --now:#e9a23b;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#e2e5ea;
    --ink:#1d2430; --ink-dim:#6b7280; --now:#e9a23b;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{ --bg:#f4f5f7; --panel:#fff; --panel2:#eef0f3; --line:#e2e5ea; --ink:#1d2430; --ink-dim:#6b7280; --now:#e9a23b; }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:var(--font);
    font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
    transition:background .3s, color .3s;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .wrap{display:grid; grid-template-columns:1fr; grid-template-rows:auto 1fr auto; height:100vh; gap:calc(16px * var(--density)); padding:calc(20px * var(--density))}
  header{display:flex; align-items:center; justify-content:space-between}

  /* multi-page shell + bottom nav */
  .pages{position:relative; min-height:0}
  .page{position:absolute; inset:0; display:none; min-height:0}
  .page.active{display:block}
  .cal-page{grid-template-columns:1fr 380px; grid-template-rows:1fr; gap:calc(16px * var(--density))}
  .cal-page.active{display:grid}
  .page-pad{position:absolute; inset:0; overflow:auto; padding:2px}
  .page-grid2{display:grid; grid-template-columns:1fr 1fr; gap:calc(16px * var(--density)); align-items:start}
  @media(max-width:860px){ .page-grid2{grid-template-columns:1fr} }
  .page-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px}
  .ph-card{max-width:460px; text-align:center; background:var(--panel); border-radius:var(--r); padding:42px 32px}
  .ph-ico{font-size:56px; margin-bottom:10px}
  .ph-card h3{font-size:22px; margin-bottom:8px}
  .ph-card p{color:var(--ink-dim); font-size:15px; line-height:1.55}
  .ph-card code{background:var(--panel2); padding:2px 6px; border-radius:5px; font-size:13px}
  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px}
  .photo-grid img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px}
  /* ---- calendar status bar (smart-home glance) ---- */
  .homebar{display:none; flex:none; gap:10px; align-items:center; padding:7px 14px; background:var(--panel2);
           border-bottom:1px solid var(--line); font-size:13.5px; overflow-x:auto; white-space:nowrap; cursor:pointer}
  .homebar.show{display:flex}
  .homebar .hb{display:inline-flex; align-items:center; gap:6px; color:var(--ink-dim)}
  .homebar .hb b{color:var(--ink); font-weight:600}
  .homebar .hb.armed b{color:#3bb273}
  .homebar .hb.warn{color:#e0a44a}
  .homebar .hb-sep{opacity:.3}
  /* ---- Home / smart-home tab ---- */
  .home-wrap{position:absolute; inset:0; overflow:auto; padding:10px 8px 20px}
  .home-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:2px 6px 14px; font-size:14px; color:var(--ink-dim)}
  .home-bar .pill{display:inline-flex; align-items:center; gap:6px; background:var(--panel); border-radius:999px; padding:5px 12px}
  .home-bar .dot{width:9px; height:9px; border-radius:50%; background:#3bb273}
  .home-bar .dot.off{background:#c75146}
  .home-bar .demo{background:var(--now); color:#fff}
  .home-sec{margin:0 4px 18px}
  .home-sec h3{font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:0 4px 8px}
  .tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
  .tile{position:relative; background:var(--panel); border:1px solid transparent; border-radius:14px; padding:14px; min-height:84px;
        display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; user-select:none;
        transition:transform .08s, background .15s, border-color .15s}
  .tile:active{transform:scale(.97)}
  .tile.ro{cursor:default}
  .tile.ro:active{transform:none}
  .tile.on{background:color-mix(in srgb, var(--now) 20%, var(--panel)); border-color:color-mix(in srgb, var(--now) 55%, transparent);
           box-shadow:0 6px 22px color-mix(in srgb, var(--now) 22%, transparent)}
  .tile.on .t-ico{filter:drop-shadow(0 0 7px color-mix(in srgb, var(--now) 55%, transparent))}
  .tile .t-ico{font-size:26px; line-height:1}
  .tile .t-name{font-size:15px; font-weight:600; margin-top:auto}
  .tile .t-state{font-size:12.5px; color:var(--ink-dim)}
  .tile.on .t-state{color:var(--now)}
  .tile.scene{align-items:center; text-align:center; justify-content:center}
  .tile.scene .t-name{margin-top:6px}
  /* ---- command-center hero (Home tab) ---- */
  .cc-hero{background:linear-gradient(135deg, color-mix(in srgb,var(--now) 20%, var(--panel)), var(--panel) 70%);
    border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin:2px 4px 16px}
  .cc-hero-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:13px}
  .cc-greet{font-size:23px; font-weight:700; line-height:1.1}
  .cc-date{font-size:13px; color:var(--ink-dim); margin-top:3px}
  .cc-live{font-size:12px; color:#3bb273; font-weight:600}
  .cc-demo{font-size:12px; background:var(--now); color:#1a1205; padding:4px 11px; border-radius:999px; font-weight:700}
  .cc-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .cc-chip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; background:var(--panel2);
    border-radius:999px; padding:5px 11px; color:var(--ink-dim)}
  .cc-chip.ok{color:#3bb273} .cc-chip.warn{color:#e0a44a}
  .cc-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px}
  .cc-kpi{background:var(--panel2); border-radius:13px; padding:12px 8px; text-align:center}
  .cc-kpi-v{font-size:22px; font-weight:700; line-height:1}
  .cc-kpi-v small{font-size:12px; color:var(--ink-dim); font-weight:600; margin-left:2px}
  .cc-kpi-l{font-size:10.5px; color:var(--ink-dim); margin-top:5px; text-transform:uppercase; letter-spacing:.05em}
  .cc-actions{display:flex; gap:8px; flex-wrap:wrap}
  .cc-qa{background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:11px;
    padding:11px 15px; font:inherit; font-size:14px; font-weight:600; cursor:pointer}
  .cc-qa:active{transform:scale(.97)}
  @media(max-width:620px){ .cc-kpis{grid-template-columns:repeat(2,1fr)} }
  /* ---- Home view switcher + floor plan ---- */
  .home-view-nav{display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:5px; margin:2px 4px 14px}
  .hv-btn{flex:1; background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px; font-weight:600; padding:10px 0; border-radius:8px; cursor:pointer}
  .hv-btn.active{background:var(--panel2); color:var(--ink)}
  .fp{padding:0 4px}
  .fp svg{width:100%; height:auto; max-height:72vh; display:block}
  .fp .room{cursor:pointer}
  .fp .room rect{fill:var(--panel2); stroke:var(--line); stroke-width:2; transition:fill .2s,stroke .2s}
  .fp .room.on rect{fill:color-mix(in srgb,var(--now) 28%, var(--panel)); stroke:color-mix(in srgb,var(--now) 60%, transparent)}
  .fp .room .rname{fill:var(--ink); font-size:14px; font-weight:600}
  .fp .room .rtemp{fill:var(--ink-dim); font-size:13px}
  .fp .room .rdot{fill:#6b7280}
  .fp .room.on .rdot{fill:var(--now); filter:drop-shadow(0 0 4px var(--now))}
  .fp-note{color:var(--ink-dim); font-size:12.5px; padding:12px 8px 4px; text-align:center}
  /* PIN pad modal */
  .pinpad{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:60}
  .pinpad.on{display:flex}
  .pin-card{background:var(--panel); border-radius:18px; padding:22px; width:300px; max-width:92vw; text-align:center}
  .pin-card h3{font-size:18px; margin-bottom:4px}
  .pin-card .pin-sub{color:var(--ink-dim); font-size:13px; margin-bottom:12px}
  .pin-dots{letter-spacing:10px; font-size:26px; height:30px; margin-bottom:12px}
  .pin-keys{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .pin-keys button{font-size:22px; padding:14px 0; border:none; border-radius:12px; background:var(--panel2); color:var(--ink); cursor:pointer}
  .pin-keys button:active{transform:scale(.95)}
  .pin-x{margin-top:12px; background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:14px}
  /* TV / Roku remote */
  .remote-card{background:var(--panel); border-radius:20px; padding:20px; width:300px; max-width:92vw; text-align:center}
  .remote-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; font-size:17px; font-weight:600}
  .rbtn{border:none; border-radius:12px; background:var(--panel2); color:var(--ink); font:inherit; font-size:16px; cursor:pointer; padding:12px}
  .rbtn:active{transform:scale(.94)}
  .rbtn.power{background:#c75146; color:#fff; width:46px; height:46px; border-radius:50%; font-size:20px; padding:0}
  .dpad{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,56px); gap:8px; margin:0 auto 14px; width:200px}
  .dpad .up{grid-area:1/2} .dpad .left{grid-area:2/1} .dpad .ok{grid-area:2/2}
  .dpad .right{grid-area:2/3} .dpad .down{grid-area:3/2}
  .dpad .ok{background:var(--now); color:#fff; border-radius:50%; font-weight:700}
  .remote-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px}
  .remote-apps{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0 4px}
  .remote-apps .rbtn{font-size:14px; padding:10px}

  .bottomnav{display:flex; gap:8px; background:var(--panel); border-radius:var(--r); padding:8px}
  .bottomnav button{flex:1; background:none; border:0; color:var(--ink-dim); font:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:58px; border-radius:12px; transition:background .12s, transform .08s}
  .bottomnav button .ico{font-size:23px; line-height:1}
  .bottomnav button .lbl{font-size:12px; font-weight:600}
  .bottomnav button.active{background:var(--panel2); color:var(--ink)}
  .bottomnav button:active{transform:scale(.95)}
  .confetti{position:fixed; z-index:70; width:9px; height:9px; border-radius:2px; pointer-events:none}

  /* on-screen keyboard (touch wall has no physical keyboard) */
  #osk{position:fixed; left:0; right:0; bottom:0; z-index:58; background:var(--panel2);
    border-top:1px solid var(--line); padding:8px 8px 10px; display:none; box-shadow:0 -10px 30px rgba(0,0,0,.4)}
  #osk.on{display:block}
  .osk-row{display:flex; gap:6px; justify-content:center; margin:6px 0}
  .osk-key{flex:1 1 0; max-width:94px; min-height:52px; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; color:var(--ink); font:inherit; font-size:20px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none}
  .osk-key:active{background:var(--now); color:#fff}
  .osk-key.wide{flex:1.6 1 0; max-width:150px; font-size:15px}
  .osk-key.space{flex:6 1 0; max-width:none}
  .date{font-size:30px; font-weight:700; letter-spacing:-.02em}
  .date small{display:block; font-size:13px; font-weight:500; color:var(--ink-dim); letter-spacing:.18em; text-transform:uppercase; margin-top:2px}
  .right{display:flex; align-items:center; gap:18px}
  .clock{font-size:28px; font-weight:300; color:var(--ink-dim)}
  .gear{background:var(--panel); border:1px solid var(--line); color:var(--ink-dim); width:42px; height:42px; border-radius:10px; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .gear:active{transform:scale(.95)}
  .off-badge{font-size:11px; font-weight:700; letter-spacing:.02em; color:#fff; background:#e0533d;
    padding:4px 9px; border-radius:999px; white-space:nowrap}
  header.has-hero .off-badge{box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .wx{display:flex; align-items:center; gap:8px; font-size:20px; color:var(--ink-dim)}
  .wx .t{font-size:24px; font-weight:600; color:var(--ink)}
  .wx .hl{font-size:13px; line-height:1.1}

  .tabs{display:flex; gap:4px; background:var(--panel); border-radius:10px; padding:4px}
  .tabs button{background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px; font-weight:600;
    padding:8px 16px; border-radius:7px; cursor:pointer; transition:.15s}
  .tabs button.active{background:var(--panel2); color:var(--ink)}

  .main{background:var(--panel); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column}
  .side{display:flex; flex-direction:column; gap:0; overflow:hidden}
  .card{background:var(--panel); border-radius:var(--r); padding:15px 18px; display:flex; flex-direction:column; min-height:0; overflow:hidden}
  .card h2{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; font-weight:600; display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none}
  .card h2 .caret{font-size:9px; letter-spacing:0; transition:transform .2s}
  .card h2 .h2r{display:flex; align-items:center; gap:10px}
  .card .addbtn{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; font-size:16px;
    font-weight:700; width:24px; height:24px; border-radius:6px; cursor:pointer; line-height:1; letter-spacing:0;
    display:flex; align-items:center; justify-content:center}
  .card .addbtn:active{transform:scale(.92)}
  .qa-input{width:100%; background:var(--panel2); border:1px solid var(--now); border-radius:8px; color:var(--ink);
    font:inherit; font-size:15px; padding:9px 11px; margin-bottom:8px}
  .card.collapsed{flex:0 0 auto !important; min-height:0}
  .card.collapsed h2{margin-bottom:0}
  .card.collapsed .body{display:none}
  .card.collapsed h2 .caret{transform:rotate(-90deg)}
  .card .body{overflow-y:auto}
  .list-row{display:flex; align-items:center; gap:11px; padding:7px 0; border-top:1px solid var(--line); cursor:pointer}
  .list-row:first-child{border-top:0}
  .box{width:20px; height:20px; border-radius:6px; border:2px solid var(--line); flex:none; transition:.15s}
  .list-row.done .box{background:var(--now); border-color:var(--now)}
  .list-row.done .label{text-decoration:line-through; color:var(--ink-dim)}
  .label{font-size:15px; flex:1}
  .qty{font-size:13px; color:var(--ink-dim)}
  .dot{width:9px; height:9px; border-radius:50%; flex:none}
  .empty{color:var(--ink-dim); font-size:14px; font-style:italic; padding:4px 0}

  /* day/night hero banner behind the header */
  header{position:relative; isolation:isolate}
  header.has-hero{min-height:118px; border-radius:var(--r); overflow:hidden; padding:16px 20px}
  .hero{position:absolute; inset:0; z-index:-1; background:#0b1020; display:none}
  header.has-hero .hero{display:block}
  .hero .layer{position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1.5s}
  .hero .grad{position:absolute; inset:0; transition:background 2s}
  .hero .scrim{position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.12) 42%, rgba(0,0,0,.5))}
  header.has-hero .date, header.has-hero .clock{color:#fff}
  header.has-hero .date small{color:#dfe3ea}
  header.has-hero .wx{color:#eef} header.has-hero .wx .t{color:#fff}
  header.has-hero .gear{background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.28); color:#fff}
  header.has-hero .tabs{background:rgba(0,0,0,.32)} header.has-hero .tabs button{color:#dfe3ea}
  header.has-hero .tabs button.active{background:rgba(255,255,255,.22); color:#fff}

  /* scheduled screen-off (night blackout; taps wake it) */
  #screenoff{position:fixed; inset:0; background:#000; z-index:60; opacity:0; pointer-events:none; transition:opacity 1s}
  #screenoff.on{opacity:1; pointer-events:auto; cursor:none}

  /* kids' scoreboard */
  .sb .body{display:flex; flex-direction:column; gap:11px}
  .sb-row{display:flex; align-items:center; gap:11px}
  .sb-rank{font-size:15px; width:20px; text-align:center; flex:none}
  .sb-av{width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center;
    justify-content:center; color:#fff; font-weight:700; font-size:13px}
  .sb-main{flex:1; min-width:0}
  .sb-name{font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:8px}
  .sb-stars{color:var(--now); font-weight:700; font-size:13px; white-space:nowrap}
  .sb-bar{height:6px; border-radius:4px; background:var(--panel2); overflow:hidden; margin-top:5px}
  .sb-fill{height:100%; border-radius:4px; transition:width .5s}
  .sb-sub{font-size:11px; color:var(--ink-dim); margin-top:3px}

  /* settings text input (banner URLs, times) */
  .sd-text{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font:inherit; font-size:14px; padding:8px 10px; margin-top:8px}
  .sd-row{display:flex; gap:10px; align-items:center; margin-top:8px}
  .sd-row input[type=time]{background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font:inherit; padding:7px 9px}

  .rail{flex:1; overflow-y:auto; padding:6px 0; position:relative}
  .hour{display:grid; grid-template-columns:62px 1fr; min-height:52px; border-top:1px solid var(--line)}
  .hour:first-child{border-top:0}
  .hour .t{font-size:12px; color:var(--ink-dim); padding:8px 0 0 16px}
  .hour .slot{padding:6px 16px 6px 0; display:flex; flex-direction:column; gap:5px}
  .ev{background:var(--panel2); border-left:4px solid var(--accent,#4f86c6); border-radius:8px; padding:7px 11px; font-size:15px; font-weight:600}
  .ev .who{font-size:11px; color:var(--ink-dim); font-weight:500; text-transform:uppercase; letter-spacing:.06em}
  .nowline{position:absolute; left:62px; right:10px; height:2px; background:var(--now); box-shadow:0 0 10px var(--now); z-index:2}
  .nowline::before{content:""; position:absolute; left:-5px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--now)}

  .week{flex:1; display:grid; grid-template-columns:repeat(7,1fr); overflow:hidden}
  .wday{border-left:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden}
  .wday:first-child{border-left:0}
  .wday .head{padding:10px; text-align:center; border-bottom:1px solid var(--line); cursor:pointer}
  .wday .head .dn{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em}
  .wday .head .dd{font-size:22px; font-weight:700; margin-top:2px}
  .wday.today .head .dd{color:var(--now)}
  .wday .evs{flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:5px}
  .wev{background:var(--panel2); border-left:3px solid var(--accent,#4f86c6); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; line-height:1.25}
  .wev .tm{display:block; font-size:10px; color:var(--ink-dim); font-weight:500}

  .agenda{flex:1; overflow-y:auto; padding:2px}
  .agenda-day{position:sticky; top:0; background:var(--panel); z-index:1; font-size:12px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); padding:14px 12px 6px}
  .agenda-day.today{color:var(--now)}
  .agenda-ev{display:flex; align-items:center; gap:12px; padding:11px 12px; border-top:1px solid var(--line); cursor:pointer}
  .agenda-time{font-size:13px; color:var(--ink-dim); width:78px; flex:none; font-feature-settings:"tnum" 1}
  .agenda-dot{width:10px; height:10px; border-radius:50%; flex:none}
  .agenda-title{font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .agenda-ev:active{background:var(--panel2)}

  .month{flex:1; display:flex; flex-direction:column; padding:8px}
  .mdow{display:grid; grid-template-columns:repeat(7,1fr); padding:0 4px 8px}
  .mdow span{text-align:center; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em}
  .mgrid{flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:4px}
  .mcell{background:var(--panel2); border-radius:8px; padding:6px 8px; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; gap:3px; transition:.15s}
  .mcell.dim{opacity:.35}
  .mcell.today{outline:2px solid var(--now)}
  .mcell .num{font-size:14px; font-weight:600}
  .mdot{height:5px; border-radius:3px; background:var(--accent,#4f86c6); flex:none}
  .mev{font-size:11px; font-weight:600; line-height:1.2; padding:1px 5px; border-radius:4px; flex:none; cursor:pointer;
    background:color-mix(in srgb, var(--accent,#4f86c6) 20%, var(--panel)); border-left:3px solid var(--accent,#4f86c6);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .mev .mt{color:var(--ink-dim); font-weight:500; margin-right:3px}
  .mmore{font-size:10px; color:var(--ink-dim)}

  /* calendar nav toolbar */
  .cal-tools{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex:none}
  .cal-tools button{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; font-weight:600; border-radius:8px; cursor:pointer}
  .cal-tools .nav{display:flex; gap:6px}
  .cal-tools .nav button{width:36px; height:36px; font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center}
  .cal-tools .today{padding:0 16px; height:36px; font-size:14px}
  .cal-tools button:active{transform:scale(.95)}
  .cal-tools .period{font-size:18px; font-weight:700; letter-spacing:-.01em; margin-left:2px}
  .cal-tools .zoom{display:flex; gap:6px; margin-left:auto}
  .cal-tools .zoom button{width:36px; height:36px; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center}
  .calbody{flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0}

  /* draggable handles to resize the side panels */
  .resizer{height:10px; flex:none; cursor:row-resize; position:relative; touch-action:none}
  .resizer::before{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:42px; height:4px; border-radius:2px; background:var(--line); transition:.15s}
  .resizer:hover::before, .resizer.drag::before{background:var(--ink-dim); width:60px}

  /* day/week hourly time-grid */
  .tg{flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0}
  .tg-head{display:grid; grid-template-columns:54px repeat(var(--cols,7),1fr); flex:none; padding-right:var(--sbw,0px)}
  .tg-head .cnr{border-bottom:1px solid var(--line)}
  .tg-head .dcol{padding:7px 2px; text-align:center; cursor:pointer; border-left:1px solid var(--line); border-bottom:1px solid var(--line)}
  .tg-head .dcol .dn{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em}
  .tg-head .dcol .dd{font-size:18px; font-weight:700; margin-top:1px}
  .tg-head .dcol.today .dd{color:var(--now)}
  .tg-head .dcol .dwx{font-size:11px; color:var(--ink-dim); margin-top:2px; white-space:nowrap}
  .tg-allday{display:grid; grid-template-columns:54px repeat(var(--cols,7),1fr); flex:none; border-bottom:1px solid var(--line); max-height:78px; overflow-y:auto; padding-right:var(--sbw,0px)}
  .tg-allday .lbl{font-size:9px; color:var(--ink-dim); padding:5px 4px 0; text-transform:uppercase; text-align:right; letter-spacing:.04em}
  .tg-allday .adcol{border-left:1px solid var(--line); padding:3px; display:flex; flex-direction:column; gap:3px; min-height:24px}
  .adev{font-size:11px; font-weight:600; background:color-mix(in srgb, var(--accent,#4f86c6) 20%, var(--panel)); border-left:3px solid var(--accent,#4f86c6); border-radius:5px; padding:2px 6px; cursor:pointer; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .tg-body{flex:1; overflow-y:auto; position:relative; min-height:0; scrollbar-gutter:stable}
  .tg-cols{display:grid; grid-template-columns:54px repeat(var(--cols,7),1fr); position:relative}
  .tg-gut .gh{height:var(--hpx,46px); font-size:11px; color:var(--ink-dim); text-align:right; padding-right:7px; transform:translateY(-7px)}
  .tg-day{position:relative; border-left:1px solid var(--line);
    background-image:repeating-linear-gradient(var(--line) 0 1px, transparent 1px var(--hpx,46px))}
  .tg-ev{position:absolute; left:3px; right:3px; background:color-mix(in srgb, var(--accent,#4f86c6) 20%, var(--panel));
    border-left:3px solid var(--accent,#4f86c6);
    border-radius:6px; padding:3px 7px; font-size:11px; font-weight:600; line-height:1.18; overflow:hidden; cursor:pointer}
  .tg-ev .tm{display:block; font-size:9px; color:var(--ink-dim); font-weight:500}
  .tg-now{position:absolute; height:2px; background:var(--now); box-shadow:0 0 8px var(--now); z-index:3; pointer-events:none}
  .tg-now::before{content:""; position:absolute; left:-4px; top:-3px; width:9px; height:9px; border-radius:50%; background:var(--now)}

  #sleep{position:fixed; inset:0; background:#000; z-index:50; opacity:0; pointer-events:none; transition:opacity 1.2s}
  #sleep.on{opacity:1; pointer-events:auto}
  #sleep img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 2s}
  #sleep img.show{opacity:1}
  #sleep .ovl{position:absolute; left:40px; bottom:40px; z-index:2; text-shadow:0 2px 20px #000}
  #sleep .ovl .t{font-size:64px; font-weight:200; color:#fff}
  #sleep .ovl .d{font-size:20px; color:#ddd; margin-top:4px}

  /* settings drawer */
  #settings-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; opacity:0; pointer-events:none; transition:.25s}
  #settings-overlay.on{opacity:1; pointer-events:auto}
  #settings-drawer{position:fixed; top:0; right:0; bottom:0; width:380px; max-width:90vw; background:var(--panel);
    border-left:1px solid var(--line); z-index:61; transform:translateX(100%); transition:transform .28s;
    padding:24px; overflow-y:auto}
  #settings-drawer.on{transform:translateX(0)}
  .sd-title{font-size:22px; font-weight:700; margin-bottom:20px}
  .sd-group{margin-bottom:22px}
  .sd-group>label{display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; margin-bottom:10px}
  .sd-seg{display:flex; flex-wrap:wrap; gap:6px}
  .sd-seg button{flex:1; min-width:72px; background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim);
    font:inherit; font-size:14px; font-weight:600; padding:10px 8px; border-radius:9px; cursor:pointer}
  .sd-seg button.active{background:var(--now); border-color:var(--now); color:#1a1205}
  .sd-people-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
  .sd-people-row:first-child{border-top:0}
  .sd-people-row .pdot{width:18px; height:18px; border-radius:50%; flex:none; cursor:pointer}
  .sd-people-row .pname{flex:1; font-size:15px; cursor:pointer}
  .sd-people-row .pdel{background:none; border:0; color:var(--ink-dim); font-size:18px; cursor:pointer; padding:2px 6px}
  .np-name{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink);
    font:inherit; font-size:15px; padding:11px; margin:10px 0}
  .sd-addbtn{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit;
    font-size:14px; font-weight:600; padding:11px; border-radius:10px; cursor:pointer; margin-top:10px}
  .sd-colors{display:flex; gap:10px; flex-wrap:wrap}
  .sd-colors .sw{width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer}
  .sd-colors .sw.sel{border-color:var(--ink); transform:scale(1.1)}
  .sd-toggles{display:flex; flex-direction:column; gap:12px}
  .sd-hours{display:flex; align-items:center; gap:10px}
  .sd-hours select{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    font:inherit; font-size:15px; font-weight:600; padding:10px; border-radius:9px; cursor:pointer}
  .sd-hours span{color:var(--ink-dim); font-size:13px}
  .sd-toggles label{display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer}
  .sd-fx-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
  .sd-fx-row label{flex:1; display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer}
  .sd-fx-row input{width:20px; height:20px; accent-color:var(--now)}
  .sd-fx-row .prev{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit;
    font-size:13px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer}
  .sd-toggles input{width:20px; height:20px; accent-color:var(--now)}
  .sd-close{width:100%; background:var(--now); color:#1a1205; border:0; border-radius:12px; font:inherit;
    font-size:16px; font-weight:700; padding:14px; cursor:pointer; margin-top:8px}

  /* event editor modal */
  #ev-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:70; opacity:0; pointer-events:none; transition:.2s}
  #ev-overlay.on{opacity:1; pointer-events:auto}
  #ev-modal{position:fixed; top:50%; left:50%; transform:translate(-50%,-46%); width:420px; max-width:92vw;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; z-index:71;
    opacity:0; pointer-events:none; transition:.2s}
  #ev-modal.on{opacity:1; pointer-events:auto; transform:translate(-50%,-50%)}
  .ev-title{font-size:20px; font-weight:700; margin-bottom:16px}
  #ev-modal input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font:inherit; font-size:16px; padding:12px; margin-bottom:11px}
  #ev-modal textarea{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font:inherit; font-size:15px; padding:12px; margin-bottom:11px; resize:vertical; min-height:58px}
  .ev-two{display:flex; gap:10px}
  .ev-two input{flex:1}
  .ev-actions{display:flex; gap:10px; margin-top:6px}
  .ev-del{flex:1; background:var(--panel2); border:1px solid var(--line); color:#e0533d; font:inherit;
    font-size:15px; font-weight:600; padding:13px; border-radius:11px; cursor:pointer}
  .ev-save{flex:2; background:var(--now); border:0; color:#1a1205; font:inherit; font-size:15px;
    font-weight:700; padding:13px; border-radius:11px; cursor:pointer}
  .ev-cancel{width:100%; background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px;
    padding:12px 0 0; cursor:pointer}
  .ev-chk{display:flex; align-items:center; gap:10px; font-size:15px; margin-bottom:11px; cursor:pointer; color:var(--ink)}
  .ev-chk input{width:20px; height:20px; accent-color:var(--now)}
  .ev-field{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px}
  .ev-field label{font-size:13px; color:var(--ink-dim); font-weight:600}
  #ev-modal select{background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink);
    font:inherit; font-size:15px; padding:10px; flex:1; max-width:62%}
  .ev-colors{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex:1}
  .ev-colors .sw{width:28px; height:28px; border-radius:50%; border:3px solid transparent; cursor:pointer}
  .ev-colors .sw.sel{border-color:var(--ink); transform:scale(1.12)}
  #ev-recur-box{border-top:1px solid var(--line); margin-top:4px; padding-top:13px}
  .ev-mlabel{display:block; font-size:13px; color:var(--ink-dim); font-weight:600; margin-bottom:8px}
  .ev-mrow{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
  .ev-mrow button{background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); font:inherit;
    font-size:12px; font-weight:600; padding:8px 0; border-radius:8px; cursor:pointer}
  .ev-mrow button.on{background:#e0533d; border-color:#e0533d; color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hero" id="hero" aria-hidden="true">
      <div class="grad" id="hero-grad"></div>
      <div class="layer" id="hero-day"></div>
      <div class="layer" id="hero-night"></div>
      <div class="scrim"></div>
    </div>
    <div class="date" id="date">—<small id="dow">loading</small></div>
    <div class="right">
      <div class="tabs">
        <button data-v="day">Day</button>
        <button data-v="week" class="active">Week</button>
        <button data-v="month">Month</button>
        <button data-v="agenda">Agenda</button>
      </div>
      <div class="clock" id="clock">--:--</div>
      <span class="off-badge" id="offline-badge" hidden>offline</span>
      <div class="wx" id="wx"></div>
      <button class="gear" id="gear" title="Settings">&#9881;</button>
    </div>
  </header>
  <main class="pages" id="pages">

    <section class="page cal-page active" id="page-calendar">
      <section class="main" id="main">
        <div id="home-statusbar" class="homebar" title="Open Home"></div>
        <div class="cal-tools">
          <div class="nav"><button id="nav-prev" title="Previous">&#8249;</button><button id="nav-next" title="Next">&#8250;</button></div>
          <button class="today" id="nav-today">Today</button>
          <button class="today" id="add-event">+ Event</button>
          <div class="period" id="period"></div>
          <div class="zoom"><button id="zoom-out" title="Zoom out">&#8722;</button><button id="zoom-in" title="Zoom in">&#43;</button></div>
        </div>
        <div class="calbody" id="calbody"></div>
      </section>
      <aside class="side">
        <div class="card sb" id="panel-scoreboard" style="display:none"><h2 data-panel="scoreboard"><span>Scoreboard</span><span class="caret">&#9662;</span></h2><div class="body" id="scoreboard"></div></div>
        <div class="card" id="panel-todos"><h2 data-panel="todos"><span>To-Do</span><span class="h2r"><button class="addbtn" data-add="todo" title="Add to-do">+</button><span class="caret">&#9662;</span></span></h2><div class="body" id="todos"></div></div>
        <div class="resizer" data-above="0" data-below="1"></div>
        <div class="card" id="panel-groceries"><h2 data-panel="groceries"><span>Groceries</span><span class="h2r"><button class="addbtn" data-add="grocery" title="Add item">+</button><span class="caret">&#9662;</span></span></h2><div class="body" id="groceries"></div></div>
        <div class="resizer" data-above="1" data-below="2"></div>
        <div class="card" id="panel-meals"><h2 data-panel="meals"><span>Today's Meals</span><span class="h2r"><button class="addbtn" data-add="meal" title="Add meal">+</button><span class="caret">&#9662;</span></span></h2><div class="body" id="meals"></div></div>
      </aside>
    </section>

    <section class="page" id="page-home">
      <div class="home-wrap" id="home-wrap"></div>
    </section>

    <section class="page" id="page-chores">
      <div class="page-pad page-grid2">
        <div class="card"><h2><span>Chores</span></h2><div class="body" id="chorelist"></div></div>
        <div class="card sb"><h2><span>Scoreboard</span></h2><div class="body" id="scoreboard2"></div></div>
      </div>
    </section>

    <section class="page" id="page-lists">
      <div class="page-pad page-grid2">
        <div class="card"><h2><span>Groceries</span><button class="addbtn" data-add="grocery" title="Add item">+</button></h2><div class="body" id="groceries2"></div></div>
        <div class="card"><h2><span>To-Do</span><button class="addbtn" data-add="todo" title="Add to-do">+</button></h2><div class="body" id="todos2"></div></div>
      </div>
    </section>

    <section class="page" id="page-photos">
      <div class="page-pad"><div class="photo-grid" id="photo-grid"></div></div>
    </section>

  </main>

  <nav class="bottomnav" id="bottomnav">
    <button data-page="calendar" class="active"><span class="ico">&#128197;</span><span class="lbl">Calendar</span></button>
    <button data-page="home"><span class="ico">&#127968;</span><span class="lbl">Home</span></button>
    <button data-page="chores"><span class="ico">&#11088;</span><span class="lbl">Chores</span></button>
    <button data-page="lists"><span class="ico">&#128221;</span><span class="lbl">Lists</span></button>
    <button data-page="photos"><span class="ico">&#128247;</span><span class="lbl">Photos</span></button>
  </nav>
</div>

<!-- settings drawer -->
<div id="settings-overlay"></div>
<div id="settings-drawer">
  <h2 class="sd-title">Settings</h2>

  <div class="sd-group"><label>Theme</label>
    <div class="sd-seg" data-key="theme">
      <button data-val="light">Light</button><button data-val="dark">Dark</button>
    </div>
  </div>

  <div class="sd-group"><label>Accent color</label>
    <div class="sd-colors" id="sd-accent"></div>
  </div>

  <div class="sd-group"><label>People</label>
    <div id="sd-people"></div>
    <input id="np-name" class="np-name" placeholder="Add a person…">
    <div class="sd-colors" id="np-colors"></div>
    <button class="sd-addbtn" id="np-add">Add person</button>
  </div>

  <div class="sd-group"><label>Font</label>
    <div class="sd-seg" data-key="font">
      <button data-val="inter">Inter</button><button data-val="serif">Serif</button>
      <button data-val="rounded">Rounded</button><button data-val="mono">Mono</button>
    </div>
  </div>

  <div class="sd-group"><label>Density</label>
    <div class="sd-seg" data-key="density">
      <button data-val="compact">Compact</button><button data-val="comfortable">Comfortable</button>
      <button data-val="spacious">Spacious</button>
    </div>
  </div>

  <div class="sd-group"><label>Calendar hours</label>
    <div class="sd-hours">
      <select id="day-start"></select>
      <span>to</span>
      <select id="day-end"></select>
    </div>
  </div>

  <div class="sd-group"><label>Show panels</label>
    <div class="sd-toggles" id="sd-panels">
      <label><input type="checkbox" data-panel="scoreboard"> Scoreboard</label>
      <label><input type="checkbox" data-panel="todos"> To-Do</label>
      <label><input type="checkbox" data-panel="groceries"> Groceries</label>
      <label><input type="checkbox" data-panel="meals"> Meals</label>
    </div>
  </div>

  <div class="sd-group"><label>On-screen keyboard</label>
    <div class="sd-toggles">
      <label><input type="checkbox" id="kbd-enabled"> Pop up a keyboard when I tap a text field</label>
    </div>
  </div>

  <div class="sd-group"><label>Day/night banner</label>
    <div class="sd-toggles">
      <label><input type="checkbox" id="hero-enabled"> Show a house photo behind the header</label>
    </div>
    <input class="sd-text" id="hero-day-url" placeholder="Day image URL  (e.g. /photos/house-day.jpg)">
    <input class="sd-text" id="hero-night-url" placeholder="Night image URL  (e.g. /photos/house-night.jpg)">
  </div>

  <div class="sd-group"><label>Night screen-off</label>
    <div class="sd-toggles">
      <label><input type="checkbox" id="disp-enabled"> Turn the screen off overnight</label>
    </div>
    <div class="sd-row">
      <span style="color:var(--ink-dim); font-size:13px">Off from</span>
      <input type="time" id="disp-start">
      <span style="color:var(--ink-dim); font-size:13px">to</span>
      <input type="time" id="disp-end">
    </div>
    <div style="color:var(--ink-dim); font-size:12px; margin-top:8px">
      Tap the screen to wake it. A motion sensor can wake it too by POSTing to
      <code>/api/display/wake</code>.
    </div>
  </div>

  <div class="sd-group"><label>Holidays</label>
    <div class="sd-toggles" id="sd-holidays">
      <label><input type="checkbox" data-hol="us_federal"> US federal</label>
      <label><input type="checkbox" data-hol="christian"> Christian</label>
      <label><input type="checkbox" data-hol="jewish"> Jewish</label>
      <label><input type="checkbox" data-hol="observances"> Fun days (Valentine's, Halloween…)</label>
    </div>
  </div>

  <div class="sd-group"><label>Seasonal effects</label>
    <div class="sd-toggles" id="sd-effects">
      <label><input type="checkbox" data-fx="effects"> Enable seasonal effects (show by date)</label>
    </div>
    <div id="sd-fxlist"></div>
  </div>

  <div class="sd-group"><label>Trouble?</label>
    <button class="sd-addbtn" id="sd-reload">&#8635; Reload the display</button>
  </div>

  <button class="sd-close" id="sd-close">Done</button>
</div>
<div id="sleep"><div class="ovl"><div class="t" id="sclock">--:--</div><div class="d" id="sdate"></div></div></div>
<div id="screenoff" title="Tap to wake"></div>

<!-- TV / Roku remote -->
<div class="pinpad" id="remote">
  <div class="remote-card">
    <div class="remote-top">
      <span id="remote-name">TV</span>
      <button class="rbtn power" data-m="power" title="Power">&#9211;</button>
    </div>
    <div class="dpad">
      <button class="rbtn up" data-m="up">&#9650;</button>
      <button class="rbtn left" data-m="left">&#9664;</button>
      <button class="rbtn ok" data-m="ok">OK</button>
      <button class="rbtn right" data-m="right">&#9654;</button>
      <button class="rbtn down" data-m="down">&#9660;</button>
    </div>
    <div class="remote-row">
      <button class="rbtn" data-m="back">&#8592; Back</button>
      <button class="rbtn" data-m="home">&#127968; Home</button>
      <button class="rbtn" data-m="play_pause">&#9199;</button>
    </div>
    <div class="remote-row">

<script>
const $ = s => document.querySelector(s);
let view = "week";
let cursor = new Date();              // the date the calendar is centered on
let cache = {events:[], dash:null};
let people = [];   // family members, from the dashboard feed
let forecast = {}; // date 'YYYY-MM-DD' -> {high, low, icon, desc}
let START_HOUR = 6, END_HOUR = 20;   // visible window, overridden by settings
let HOURPX = 46;                     // zoom level (hour-row height), from settings
const ZOOM_MIN = 26, ZOOM_MAX = 120;
function syncHours(){
  const s = FH.get();
  let a = parseInt(s.dayStart, 10); if(isNaN(a)) a = 6;
  let b = parseInt(s.dayEnd, 10);   if(isNaN(b)) b = 20;
  a = Math.min(Math.max(a, 0), 23);
  b = Math.min(Math.max(b, a + 1), 24);   // end always after start
  START_HOUR = a; END_HOUR = b;
  let z = parseInt(s.hourPx, 10); if(isNaN(z)) z = 46;
  HOURPX = Math.min(Math.max(z, ZOOM_MIN), ZOOM_MAX);
}
function zoom(dir){
  HOURPX = Math.min(Math.max(HOURPX + dir*10, ZOOM_MIN), ZOOM_MAX);
  FH.save({hourPx:HOURPX}); render();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function evStart(ev){ // local Date; date-only all-day strings parsed in local tz (no UTC shift)
  const s=ev.start; if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  return new Date(s);
}

function tick(){
  const n=new Date();
  const hm=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  $("#clock").textContent=hm; $("#sclock").textContent=hm;
  $("#date").firstChild.textContent=n.toLocaleDateString([],{month:"long",day:"numeric"});
  $("#dow").textContent=n.toLocaleDateString([],{weekday:"long",year:"numeric"});
  $("#sdate").textContent=n.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
  placeNow();
  updateHeroPhase();
}

document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{ setActive(b.dataset.v); view=b.dataset.v; render(); resetSleep(); };
});
function setActive(v){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.v===v)); }

function render(){
  syncHours();
  updatePeriod();
  if(view==="day") renderGrid([new Date(cursor)]);
  else if(view==="week") renderGrid(weekDays(cursor));
  else if(view==="agenda") renderAgenda();
  else renderMonth();
}
function renderAgenda(){
  const body=$("#calbody");
  const wrap=document.createElement("div"); wrap.className="agenda";
  const start=new Date(cursor); start.setHours(0,0,0,0);
  const horizon=new Date(start); horizon.setDate(horizon.getDate()+60);
  const evs=cache.events.map(e=>({e,s:evStart(e)}))
    .filter(x=>x.s && !isNaN(x.s) && x.s>=start && x.s<horizon)
    .sort((a,b)=> (a.s-b.s) || ((a.e.all_day?0:1)-(b.e.all_day?0:1)));
  if(!evs.length){
    wrap.innerHTML='<div class="empty" style="padding:22px 14px">Nothing coming up in the next 60 days.</div>';
    body.innerHTML=""; body.appendChild(wrap); return;
  }
  let lastKey=""; const todayKey=new Date().toDateString();
  evs.forEach(({e,s})=>{
    const key=s.toDateString();
    if(key!==lastKey){
      lastKey=key;
      const isToday=key===todayKey;
      const hd=document.createElement("div"); hd.className="agenda-day"+(isToday?" today":"");
      hd.textContent = isToday ? "Today" : s.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
      wrap.appendChild(hd);
    }
    const row=document.createElement("div"); row.className="agenda-ev";
    const time = e.all_day ? "All day" : s.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    row.innerHTML=`<span class="agenda-time">${time}</span>`
      +`<span class="agenda-dot" style="background:${esc(evColor(e))}"></span>`
      +`<span class="agenda-title">${esc(e.title)}</span>`;
    row.onclick=()=>{ openEditor(e); resetSleep(); };
    wrap.appendChild(row);
  });
  body.innerHTML=""; body.appendChild(wrap);
}
function evColor(ev){ return ev.color || "#4f86c6"; }
function weekDays(d){ const s=weekStart(d); return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x;}); }
function hourLabel(h){ const hh=h%24; return (hh%12||12)+(hh<12?'am':'pm'); }

function renderGrid(daysArr){
  const body=$("#calbody"); const cols=daysArr.length; const hrs=END_HOUR-START_HOUR;
  let head='<div class="cnr"></div>';
  daysArr.forEach(d=>{
    const wx=forecast[dateStr(d)];
    const wxhtml = wx ? `<div class="dwx">${wx.icon} ${wx.high}°/${wx.low}°</div>` : "";
    head+=`<div class="dcol${sameDay(d,new Date())?' today':''}" data-iso="${d.toISOString()}">`
        +`<div class="dn">${d.toLocaleDateString([],{weekday:'short'})}</div>`
        +`<div class="dd">${d.getDate()}</div>${wxhtml}</div>`;
  });
  let allday='<div class="lbl">all-day</div>';
  daysArr.forEach(d=>{
    let cell='';
    cache.events.filter(e=>e.all_day && sameDay(evStart(e),d)).forEach(ev=>{
      cell+=`<div class="adev" data-id="${encodeURIComponent(ev.id||'')}" style="--accent:${evColor(ev)}">${esc(ev.title)}</div>`;
    });
    allday+=`<div class="adcol">${cell}</div>`;
  });
  let gut=''; for(let h=START_HOUR;h<END_HOUR;h++) gut+=`<div class="gh">${hourLabel(h)}</div>`;
  let dayCols=''; daysArr.forEach((d,i)=> dayCols+=`<div class="tg-day" data-col="${i}"></div>`);
  body.innerHTML=
    `<div class="tg" style="--cols:${cols};--hpx:${HOURPX}px">`
    +`<div class="tg-head">${head}</div>`
    +`<div class="tg-allday">${allday}</div>`
    +`<div class="tg-body"><div class="tg-cols" id="tgcols" style="height:${hrs*HOURPX}px">`
    +`<div class="tg-gut">${gut}</div>${dayCols}</div></div></div>`;
  // place timed events into each day column
  daysArr.forEach((d,i)=>{
    const col=body.querySelector(`.tg-day[data-col="${i}"]`);
    // tap an empty slot to create an event at that hour
    col.onclick=(e)=>{ if(e.target!==col) return;
      const y=e.clientY-col.getBoundingClientRect().top;
      const hour=Math.min(END_HOUR-1, Math.max(START_HOUR, START_HOUR+Math.floor(y/HOURPX)));
      openCreate(d, `${pad(hour)}:00`); resetSleep();
    };
    cache.events.filter(e=>!e.all_day && sameDay(evStart(e),d)).forEach(ev=>{
      const sdt=evStart(ev); if(!sdt||isNaN(sdt))return;
      const sh=sdt.getHours()+sdt.getMinutes()/60; if(sh>=END_HOUR)return;
      const edt=ev.end?new Date(ev.end):null;
      const dur=(edt&&!isNaN(edt))?Math.max((edt-sdt)/3600000,0.25):1;
      const top=Math.max(0,sh-START_HOUR)*HOURPX;
      const h=Math.max(16,Math.min(dur,END_HOUR-Math.max(sh,START_HOUR))*HOURPX);
      const el=document.createElement("div"); el.className="tg-ev"; el.style.setProperty("--accent",evColor(ev));
      el.style.top=top+"px"; el.style.height=h+"px";
      el.innerHTML=`<span class="tm">${sdt.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</span>${esc(ev.title)}`;
      el.onclick=(e)=>{e.stopPropagation();openEditor(ev);};
      col.appendChild(el);
    });
  });
  // all-day chips clickable
  body.querySelectorAll(".adev").forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation(); const id=decodeURIComponent(el.dataset.id);
      const ev=cache.events.find(x=>String(x.id||'')===id && x.all_day); if(ev)openEditor(ev); };
  });
  // day header → jump into that day
  body.querySelectorAll(".dcol").forEach(el=>{
    el.onclick=()=>{ cursor=new Date(el.dataset.iso); view="day"; setActive("day"); render(); };
  });
  // current-time line, only when the visible range includes today
  if(daysArr.some(d=>sameDay(d,new Date()))){
    const line=document.createElement("div"); line.className="tg-now"; line.style.left="54px"; line.style.right="0";
    $("#tgcols").appendChild(line); placeNow();
  }
  // open scrolled near the workday / now
  const tb=body.querySelector(".tg-body");
  if(tb){ const nh=Math.min(Math.max(new Date().getHours(),START_HOUR),END_HOUR);
    tb.scrollTop=Math.max(0,(nh-START_HOUR-1))*HOURPX; }
}
function placeNow(){
  const cols=$("#tgcols"); if(!cols)return; const line=cols.querySelector(".tg-now"); if(!line)return;
  const n=new Date(); const h=n.getHours()+n.getMinutes()/60;
  if(h<START_HOUR||h>END_HOUR){ line.style.display="none"; return; }
  line.style.display=""; line.style.top=((h-START_HOUR)*HOURPX)+"px";
}

function renderMonth(){
  const body=$("#calbody");
  body.innerHTML='<div class="month"><div class="mdow"></div><div class="mgrid" id="mgrid"></div></div>';
  const dow=body.querySelector(".mdow");
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{const s=document.createElement("span");s.textContent=d;dow.appendChild(s);});
  const grid=$("#mgrid"); const ref=new Date(cursor);
  const first=new Date(ref.getFullYear(),ref.getMonth(),1);
  const gridStart=new Date(first); gridStart.setDate(1-first.getDay());
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const cell=document.createElement("div");
    cell.className="mcell"+(d.getMonth()!==ref.getMonth()?" dim":"")+(sameDay(d,new Date())?" today":"");
    cell.innerHTML=`<div class="num">${d.getDate()}</div>`;
    const dayEvs=cache.events.filter(e=>sameDay(evStart(e),d))
      .sort((a,b)=>(a.all_day?0:1)-(b.all_day?0:1) || (a.start||"").localeCompare(b.start||""));
    dayEvs.slice(0,3).forEach(ev=>{
      const chip=document.createElement("div"); chip.className="mev"; chip.style.setProperty("--accent",evColor(ev));
      const sdt=evStart(ev); const tm=(!ev.all_day && sdt && !isNaN(sdt)) ? sdt.toLocaleTimeString([],{hour:"numeric"}) : "";
      chip.innerHTML=`${tm?`<span class="mt">${tm}</span>`:""}${esc(ev.title)}`;
      chip.onclick=(e)=>{ e.stopPropagation(); openEditor(ev); };
      cell.appendChild(chip);
    });
    if(dayEvs.length>3){const m=document.createElement("div");m.className="mmore";m.textContent=`+${dayEvs.length-3} more`;cell.appendChild(m);}
    cell.onclick=()=>{ cursor=new Date(d); view="day"; setActive("day"); render(); };
    grid.appendChild(cell);
  }
}

function updatePeriod(){
  const p=$("#period"); if(!p)return;
  if(view==="day"){ p.textContent=cursor.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"}); }
  else if(view==="week"){ const ds=weekDays(cursor), a=ds[0], b=ds[6];
    const m1=a.toLocaleDateString([],{month:"short"}), m2=b.toLocaleDateString([],{month:"short"});
    p.textContent = (m1===m2) ? `${m1} ${a.getDate()} – ${b.getDate()}` : `${m1} ${a.getDate()} – ${m2} ${b.getDate()}`;
  } else if(view==="agenda"){ p.textContent = "Upcoming"; }
  else { p.textContent=cursor.toLocaleDateString([],{month:"long",year:"numeric"}); }
}
function navStep(dir){
  const c=new Date(cursor);
  if(view==="day") c.setDate(c.getDate()+dir);
  else if(view==="week") c.setDate(c.getDate()+7*dir);
  else if(view==="agenda") c.setDate(c.getDate()+14*dir);
  else c.setMonth(c.getMonth()+dir);
  cursor=c; render();
}
$("#nav-prev").onclick=()=>{ navStep(-1); resetSleep(); };
$("#nav-next").onclick=()=>{ navStep(1); resetSleep(); };
$("#nav-today").onclick=()=>{ cursor=new Date(); render(); resetSleep(); };
$("#zoom-in").onclick=()=>{ zoom(1); resetSleep(); };
$("#zoom-out").onclick=()=>{ zoom(-1); resetSleep(); };

/* swipe left/right on the calendar to change week/month/day; pinch to zoom */
(function enableTouch(){
  const el=$("#calbody"); if(!el) return;
  let x0=null,y0=null,pinch0=null,px0=null;
  el.addEventListener("touchstart",e=>{
    if(e.touches.length===2){ pinch0=dist(e.touches); px0=HOURPX; x0=null; }
    else { const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; }
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(pinch0!==null && e.touches.length===2){
      const f=dist(e.touches)/pinch0;
      HOURPX=Math.min(Math.max(Math.round(px0*f),ZOOM_MIN),ZOOM_MAX); render();
    }
  },{passive:true});
  el.addEventListener("touchend",e=>{
    if(pinch0!==null){ pinch0=null; FH.save({hourPx:HOURPX}); resetSleep(); return; }
    if(x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ navStep(dx<0?1:-1); resetSleep(); }
    x0=y0=null;
  },{passive:true});
  function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
})();

/* drag the handles between side panels to resize them */
(function enablePanelResize(){
  document.querySelectorAll(".resizer").forEach(rz=>{
    const ai=+rz.dataset.above, bi=+rz.dataset.below;
    const cards=[$("#panel-todos"),$("#panel-groceries"),$("#panel-meals")];
    let y0,fa0,fb0,h;
    const down=(e)=>{
      e.preventDefault(); rz.classList.add("drag");
      const p=e.touches?e.touches[0]:e; y0=p.clientY; h=$(".side").clientHeight;
      const sz=panelSizes(); fa0=sz[ai]; fb0=sz[bi];
      window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
    };
    const move=(e)=>{
      const p=e.touches?e.touches[0]:e; const dPx=p.clientY-y0;
      const dFlex=(dPx/h)*(fa0+fb0);            // convert pixels to flex units
      let fa=Math.max(0.25, fa0+dFlex), fb=Math.max(0.25, fb0-dFlex);
      const sz=panelSizes(); sz[ai]=fa; sz[bi]=fb; applyPanelSizes(sz);
    };
    const up=()=>{
      rz.classList.remove("drag");
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
      FH.save({panelSizes:panelSizes()}); resetSleep();
    };
    rz.addEventListener("pointerdown",down);
  });
})();
function panelSizes(){
  const cards=[$("#panel-todos"),$("#panel-groceries"),$("#panel-meals")];
  return cards.map(c=>parseFloat(c.style.flexGrow)|| (FH.get().panelSizes||[1.1,1.1,.9])[cards.indexOf(c)] || 1);
}
function applyPanelSizes(sz){
  const cards=[$("#panel-todos"),$("#panel-groceries"),$("#panel-meals")];
  cards.forEach((c,i)=>{ c.style.flexGrow=sz[i]; c.style.flexShrink=1; c.style.flexBasis="0"; });
}

function renderTodos(todos, box){

  items.forEach(g=>{
    const row=document.createElement("div"); row.className="list-row"+(g.got?" done":"");
    row.innerHTML=`<div class="box"></div><span class="dot" style="background:${g.color||'#4f86c6'}"></span><div class="label">${esc(g.item)}</div>${g.qty?`<div class="qty">${esc(g.qty)}</div>`:""}`;
    row.onclick=async()=>{await fetch(`/api/groceries/${g.id}/toggle`,{method:"POST"});load();resetSleep();};

function renderChoreList(chores, box){
  box=box||$("#chorelist"); if(!box) return; box.innerHTML="";
  if(!chores.length){box.innerHTML='<div class="empty">No chores right now — all done! \u{1F389}</div>';return;}
  chores.forEach(c=>{
    const row=document.createElement("div"); row.className="list-row";
    const stars=c.stars?`<div class="qty">${"★".repeat(Math.min(c.stars,5))}</div>`:"";
    row.innerHTML=`<div class="box"></div><span class="dot" style="background:${esc(c.color||'#4f86c6')}"></span><div class="label">${esc(c.title)}</div>${stars}`;
    row.onclick=async()=>{ await fetch(`/api/chores/${c.id}/toggle`,{method:"POST"}).catch(()=>{}); celebrate(row); load(); resetSleep(); };

  });

function renderMeals(meals, box){
  box=box||$("#meals"); if(!box) return; box.innerHTML="";
  const today=new Date().toISOString().slice(0,10);
  const t=meals.filter(m=>m.date===today);
  if(!t.length){box.innerHTML='<div class="empty">No meals planned</div>';return;}
  t.forEach(m=>{
    const row=document.createElement("div"); row.className="list-row";
    row.innerHTML=`<span class="dot" style="background:${m.color||'#4f86c6'}"></span><div class="label">${m.title}</div><div class="qty">${m.slot}</div>`;
    box.appendChild(row);
  });

function sameDay(a,b){ if(!a)return false; const x=new Date(a),y=new Date(b);
  return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }
function weekStart(d){ const s=new Date(d); s.setDate(d.getDate()-d.getDay()); s.setHours(0,0,0,0); return s; }

/* ---- offline cache: keep working if the internet (or server) drops ----
   Each fetch's last good JSON is saved locally; if a later fetch fails we fall
   back to that copy and flag the display as showing cached data. */
function cacheGet(k){ try{ const c=localStorage.getItem("fhcache:"+k); return c?JSON.parse(c):null; }catch(e){ return null; } }
function cacheSet(k,v){ try{ localStorage.setItem("fhcache:"+k, JSON.stringify({t:Date.now(),v})); }catch(e){} }
async function cachedFetch(url, key){
  try{
    const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); cacheSet(key, j); return {data:j, stale:false, t:Date.now()};
  }catch(e){
    const c=cacheGet(key); if(c) return {data:c.v, stale:true, t:c.t};
    throw e;
  }
}
let offlineSince=null;
function setOffline(stale, t){
  const b=$("#offline-badge"); if(!b) return;
  if(stale){
    const mins=t?Math.round((Date.now()-t)/60000):0;
    b.textContent = mins>0 ? `offline · updated ${mins<60?mins+"m":Math.round(mins/60)+"h"} ago` : "offline";
    b.hidden=false;
  } else { b.hidden=true; }
}

async function load(){

    ]);

    cache.dash=dash; cache.events=cal.events||[];
    setOffline(dashR.stale || calR.stale, Math.min(dashR.t||Date.now(), calR.t||Date.now()));
    people = dash.people || [];
    render();
    renderTodos(dash.todos||[]); renderGroceries(dash.groceries||[]); renderMeals(dash.meals||[]);
    loadScoreboard();

    const v=inp.value.trim(); if(!v){ inp.remove(); return; }
    if(kind==="todo") await post("/api/todos/",{title:v}).catch(()=>{});
    else if(kind==="grocery") await post("/api/groceries/",{item:v}).catch(()=>{});

function buildRecFromUI(){
  const base=$("#ev-repeat").value; if(!base) return null;
  let s=base;
  const mode=$("#ev-endmode").value;
  if(mode==="count") s+=`;count=${Math.max(1,parseInt($("#ev-count").value)||1)}`;
  else if(mode==="until" && $("#ev-until").value) s+=`;until=${$("#ev-until").value}`;
  const ex=[...document.querySelectorAll("#ev-month-row button.on")].map(b=>b.dataset.m);
  if(ex.length) s+=`;exmonths=${ex.join(",")}`;
  return s;
}
function parseRecToUI(rec){
  $("#ev-repeat").value=""; $("#ev-endmode").value="never"; $("#ev-count").value=3; $("#ev-until").value="";
  document.querySelectorAll("#ev-month-row button").forEach(b=>b.classList.remove("on"));
  if(rec){
    const [base,...mods]=rec.split(";");
    $("#ev-repeat").value=base.trim();
    mods.forEach(m=>{ const [k,v]=m.split("=");
      if(k==="count"){ $("#ev-endmode").value="count"; $("#ev-count").value=v; }
      else if(k==="until"){ $("#ev-endmode").value="until"; $("#ev-until").value=v; }
      else if(k==="exmonths"){ v.split(",").forEach(mm=>{ const b=document.querySelector(`#ev-month-row button[data-m="${mm}"]`); if(b)b.classList.add("on"); }); }
    });
  }
  updateRecurUI();
}

function openEditor(ev){
  // Every event opens a popup. Holidays/demo are read-only; local events are
  // fully editable (incl. recurrence); Google/iCloud events edit title+time.
  const isLocal = ev.source==="local";
  const isCal = ev.source==="google" || ev.source==="caldav" || ev.source==="icloud";
  const editable = !!ev.id && (isLocal || isCal);
  modalMode = !editable ? "view" : isLocal ? "edit-local"
            : (ev.source==="caldav"||ev.source==="icloud") ? "edit-icloud" : "edit-google";
  editing = editable ? ev : null;
  $(".ev-title").textContent = editable ? "Edit event" : (ev.title||"Event");
  $("#ev-name").value=ev.title||"";
  const d=ev.start?evStart(ev):new Date(); const valid=d&&!isNaN(d);
  $("#ev-allday").checked=!!ev.all_day;
  $("#ev-date").value=valid?dateStr(d):"";
  $("#ev-time").value=(ev.all_day||!valid)?"":d.toTimeString().slice(0,5);
  $("#ev-dur").value="60";
  $("#ev-name").disabled=$("#ev-date").disabled=$("#ev-time").disabled=$("#ev-allday").disabled=!editable;
  $("#ev-desc").value=ev.description||""; $("#ev-desc").disabled=!editable;
  $("#ev-desc").style.display=(editable||ev.description)?"":"none";
  chosenEvColor = editable ? (ev.color || null) : null; syncEvColors();
  $("#ev-color-row").style.display = editable ? "flex" : "none";
  fillPersonOptions(ev.person_id); $("#ev-person-row").style.display = editable ? "flex" : "none";
  if(modalMode==="edit-local"){ $("#ev-recur-box").style.display=""; parseRecToUI(ev.recurrence); }
  else { $("#ev-recur-box").style.display="none"; }
  updateAllDayUI();
  $("#ev-del").style.display=editable?"":"none";
  $("#ev-save").style.display=editable?"":"none";
  $("#ev-modal").classList.add("on"); $("#ev-overlay").classList.add("on");
}

function eventTimes(){

  const date=$("#ev-date").value || dateStr(new Date());
  if(allday) return {start:date, end:nextDayStr(date), all_day:true};
  const time=$("#ev-time").value||"09:00";
  const start=`${date}T${time}:00`;
  return {start, end:plusMinutesLocal(start, parseInt($("#ev-dur").value)||60), all_day:false};
}

        body:JSON.stringify({event_id:editing.id, title, start:t.start, end:t.end, description:desc, color:chosenEvColor, target})});

/* ---- day/night hero banner ---- */
let heroSun = { sunrise:null, sunset:null };   // ISO local times from weather
function applyHero(){
  const s=FH.get();
  document.querySelector("header").classList.toggle("has-hero", !!s.heroEnabled);
  $("#hero-day").style.backgroundImage   = s.heroDay   ? `url("${s.heroDay}")`   : "";
  $("#hero-night").style.backgroundImage = s.heroNight ? `url("${s.heroNight}")` : "";
  updateHeroPhase();
}
function nightFraction(){
  // 0 = full day, 1 = full night, ~1h crossfade around sunrise/sunset
  const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
  const toMin=(iso,def)=>{ if(!iso) return def; const t=iso.slice(11,16).split(":"); return (+t[0])*60+(+t[1]); };
  const sr=toMin(heroSun.sunrise, 7*60), ss=toMin(heroSun.sunset, 19*60), fade=60;
  if(mins < sr-fade/2) return 1;
  if(mins < sr+fade/2) return (sr+fade/2-mins)/fade;   // dawn 1->0
  if(mins < ss-fade/2) return 0;
  if(mins < ss+fade/2) return (mins-(ss-fade/2))/fade; // dusk 0->1
  return 1;
}
function updateHeroPhase(){
  const s=FH.get(); if(!s.heroEnabled) return;
  const n=nightFraction();
  $("#hero-day").style.opacity   = 1-n;
  $("#hero-night").style.opacity = n;
  const day  ="linear-gradient(120deg,#7fb6f0,#bfe0ff 55%,#e9f3ff)";
  const dusk ="linear-gradient(120deg,#2a3a63,#7a5b8c 55%,#e08a5b)";
  const night="linear-gradient(120deg,#0b1020,#132544 55%,#1b2b4a)";
  $("#hero-grad").style.background = n>0.6 ? night : (n>0.25 ? dusk : day);
  // gradient only shows when no photos are set; photos cover it otherwise
  $("#hero-grad").style.opacity = (s.heroDay || s.heroNight) ? 0 : 1;
}

/* ---- Home / smart-home tab (talks to Home Assistant via /api/ha) ---- */
const HA_ICON = {
  light:"\u{1F4A1}", switch:"\u{1F50C}", fan:"\u{1F32C}️", cover:"\u{1F6AA}",
  lock:"\u{1F512}", climate:"\u{1F321}️", media_player:"\u{1F4FA}",
  scene:"✨", script:"▶️", alarm_control_panel:"\u{1F6E1}️",
  binary_sensor:"\u{1F6A6}", sensor:"\u{1F321}️"
};
function haIcon(t){
  if(t.domain==="lock") return t.state==="locked"?"\u{1F512}":"\u{1F513}";
  if(t.domain==="binary_sensor" && t.device_class==="motion") return "\u{1F3C3}";
  return HA_ICON[t.domain] || "⚙️";
}
function haStateLabel(t){
  if(t.domain==="climate"){
    const cur=t.current_temperature, tgt=t.target_temperature;
    return (cur!=null?cur+"° now":"") + (tgt!=null?" → "+tgt+"°":"") || t.state;
  }
  if(t.domain==="sensor") return (t.state||"")+(t.unit||"");
  if(t.domain==="scene"||t.domain==="script") return "Tap to run";
  const nice={on:"On",off:"Off",open:"Open",closed:"Closed",locked:"Locked",
    unlocked:"Unlocked",playing:"Playing",idle:"Idle",disarmed:"Disarmed",
    armed_home:"Armed (home)",armed_away:"Armed (away)",armed_night:"Armed (night)"};
  return nice[t.state] || t.state || "";
}
async function loadHomeStatus(){
  const bar=$("#home-statusbar"); if(!bar) return;
  if(curPage!=="calendar"){ bar.classList.remove("show"); return; }
  let s;
  try{ s=(await cachedFetch("/api/ha/status","hastatus")).data; }
  catch(e){ bar.classList.remove("show"); return; }
  if(!s || !s.connected){ bar.classList.remove("show"); return; }
  const parts=[];
  const armed=(s.alarm||"").startsWith("armed");
  const alarmLabel={disarmed:"Disarmed",armed_home:"Armed home",armed_away:"Armed away",
    armed_night:"Armed night",pending:"Pending",triggered:"TRIGGERED"}[s.alarm]||s.alarm;
  if(s.alarm) parts.push(`<span class="hb ${armed?'armed':''}">\u{1F6E1}️ <b>${esc(alarmLabel)}</b></span>`);
  if((s.open_doors||[]).length) parts.push(`<span class="hb warn">⚠️ ${esc(s.open_doors.join(", "))} open</span>`);
  (s.temps||[]).forEach(t=>parts.push(`<span class="hb">\u{1F321}️ ${esc(t.name)} <b>${t.value}${esc(t.unit)}</b></span>`));
  if(s.demo) parts.push('<span class="hb" style="opacity:.55">demo</span>');
  if(!parts.length){ bar.classList.remove("show"); return; }
  bar.innerHTML=parts.join('<span class="hb-sep">·</span>');
  bar.classList.add("show");
  bar.onclick=()=>showPage("home");
}
async function loadHome(){
  const wrap=$("#home-wrap"); if(!wrap) return;
  let h;
  try{ h=(await cachedFetch("/api/ha/home","ha")).data; }
  catch(e){ h={connected:false, groups:[], reason:"can't reach FamilyHub"}; }
  renderHome(h);
}
let homeView="tiles", lastHome=null;
function renderHome(h){
  lastHome=h;
  const wrap=$("#home-wrap"); if(!wrap) return;
  if(!h.connected){
    wrap.innerHTML =
      '<div class="page-center"><div class="ph-card"><div class="ph-ico">\u{1F3E0}</div>'+
      '<h3>Home Assistant offline</h3>'+
      '<p>'+esc(h.reason||"Can't reach Home Assistant")+'.<br><br>'+
      'Set <code>HA_URL</code> and <code>HA_TOKEN</code> in <code>.env</code>, or run with '+
      '<code>HA_DEMO=1</code> to explore with demo devices.<br><br>'+
      'Setup: <code>docs/home-assistant-setup.md</code></p></div></div>';
    return;
  }
  const views={tiles:"\u{1F3E0} Tiles", floor:"\u{1F4D0} Floor plan", iso:"\u{1F3D8}️ 3D"};
  const nav=Object.keys(views).map(v=>
    `<button class="hv-btn${homeView===v?' active':''}" data-hv="${v}">${views[v]}</button>`).join("");
  wrap.innerHTML=`<div class="home-view-nav">${nav}</div><div id="home-body"></div>`;
  wrap.querySelectorAll(".hv-btn").forEach(b=>{ b.onclick=()=>{ homeView=b.dataset.hv; renderHome(lastHome); }; });
  const body=$("#home-body");
  if(homeView==="floor") return renderFloorView(body,h);
  if(homeView==="iso") return renderIsoView(body,h);
  renderTilesView(body,h);
}
function renderTilesView(body,h){
  const tiles=(h.groups||[]).reduce((a,g)=>a.concat(g.tiles),[]);
  const alarm=tiles.find(t=>t.domain==="alarm_control_panel");
  const locks=tiles.filter(t=>t.domain==="lock");
  const lockedN=locks.filter(t=>t.state==="locked").length;
  const outdoor=tiles.find(t=>t.domain==="sensor"&&t.device_class==="temperature"&&/out/i.test(t.name));
  const power=tiles.find(t=>t.domain==="sensor"&&t.device_class==="power");
  const energy=tiles.find(t=>t.domain==="sensor"&&t.device_class==="energy");
  const onCount=tiles.filter(t=>t.on&&["light","switch","fan"].includes(t.domain)).length;
  const openThings=[];
  tiles.forEach(t=>{
    if(t.domain==="cover"&&(t.state==="open"||t.state==="opening")) openThings.push(t.name);
    if(t.domain==="binary_sensor"&&["door","garage_door","window"].includes(t.device_class)&&t.on) openThings.push(t.name);
  });
  const hr=new Date().getHours();
  const greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  const dstr=new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});

  const chips=[];
  if(alarm){ const armed=alarm.state.startsWith("armed");
    const lbl={disarmed:"Disarmed",armed_home:"Armed home",armed_away:"Armed away",armed_night:"Armed night"}[alarm.state]||alarm.state;
    chips.push(`<span class="cc-chip ${armed?'ok':''}">\u{1F6E1}️ ${esc(lbl)}</span>`); }
  if(locks.length) chips.push(lockedN===locks.length
    ? '<span class="cc-chip ok">\u{1F512} All locked</span>'
    : `<span class="cc-chip warn">\u{1F513} ${locks.length-lockedN} unlocked</span>`);
  chips.push(openThings.length
    ? `<span class="cc-chip warn">⚠️ ${esc(openThings.join(", "))} open</span>`
    : '<span class="cc-chip ok">✓ All closed</span>');
  if(outdoor) chips.push(`<span class="cc-chip">\u{1F321}️ ${esc(outdoor.state)}${esc(outdoor.unit||"")} outside</span>`);

  const kpis=[`<div class="cc-kpi"><div class="cc-kpi-v">${onCount}</div><div class="cc-kpi-l">on now</div></div>`];
  if(power) kpis.push(`<div class="cc-kpi"><div class="cc-kpi-v">${esc(power.state)}<small>${esc(power.unit||"W")}</small></div><div class="cc-kpi-l">power</div></div>`);
  if(energy) kpis.push(`<div class="cc-kpi"><div class="cc-kpi-v">${esc(energy.state)}<small>${esc(energy.unit||"kWh")}</small></div><div class="cc-kpi-l">today</div></div>`);
  kpis.push(`<div class="cc-kpi"><div class="cc-kpi-v">${h.count}</div><div class="cc-kpi-l">devices</div></div>`);

  const qa=['<button class="cc-qa" data-qa="lights-off">\u{1F4A1} All lights off</button>'];
  tiles.filter(t=>t.domain==="scene").slice(0,3).forEach(s=>
    qa.push(`<button class="cc-qa" data-scene="${esc(s.entity_id)}">✨ ${esc(s.name)}</button>`));

  let html=`<div class="cc-hero">
    <div class="cc-hero-top">
      <div><div class="cc-greet">${greet}</div><div class="cc-date">${esc(dstr)}</div></div>
      ${h.demo?'<span class="cc-demo">Demo</span>':'<span class="cc-live">● Live</span>'}
    </div>
    <div class="cc-chips">${chips.join("")}</div>
    <div class="cc-kpis">${kpis.join("")}</div>
    <div class="cc-actions">${qa.join("")}</div>
  </div>`;

  (h.groups||[]).forEach(g=>{
    html += '<div class="home-sec"><h3>'+esc(g.group)+'</h3><div class="tile-grid">';
    g.tiles.forEach(t=>{
      const scene = t.activatable;
      const ro = !t.toggleable && !t.activatable;   // sensors etc. = read-only
      const cls = "tile"+(t.on?" on":"")+(scene?" scene":"")+(ro?" ro":"");
      html += '<div class="'+cls+'" data-ha="'+esc(t.entity_id)+'" data-domain="'+esc(t.domain)+'" data-name="'+esc(t.name)+'">'+
        '<div class="t-ico">'+haIcon(t)+'</div>'+
        '<div class="t-name">'+esc(t.name)+'</div>'+
        (scene?'':'<div class="t-state">'+esc(haStateLabel(t))+'</div>')+
      '</div>';
    });
    html += '</div></div>';
  });
  body.innerHTML = html;
  body.querySelectorAll(".tile").forEach(el=>{ el.onclick=()=>onTileTap(el); });
  body.querySelectorAll(".cc-qa[data-scene]").forEach(b=>{ b.onclick=()=>runScene(b.dataset.scene); });
  const lo=body.querySelector('.cc-qa[data-qa="lights-off"]'); if(lo) lo.onclick=allLightsOff;
}

/* ---- floor-plan view (sample layout; rooms map to HA entities by name) ---- */
const FLOORPLAN=[
  {name:"Master Bed", key:"master", x:16,y:16,w:200,h:150},
  {name:"Bath",       key:"bath",   x:224,y:16,w:110,h:150},
  {name:"Office",     key:"office", x:342,y:16,w:150,h:150},
  {name:"Living Room",key:"living", x:16,y:174,w:260,h:168},
  {name:"Kitchen",    key:"kitchen",x:284,y:174,w:208,h:168},
  {name:"Garage",     key:"garage", x:16,y:350,w:170,h:122},
  {name:"Front Porch",key:"porch",  x:194,y:350,w:298,h:122},
];
function renderFloorView(body,h){
  const tiles=(h.groups||[]).reduce((a,g)=>a.concat(g.tiles),[]);
  const lc=s=>String(s||"").toLowerCase();
  const rooms=FLOORPLAN.map(r=>{
    const light=tiles.find(t=>t.domain==="light"&&lc(t.name).includes(r.key));
    const cover=tiles.find(t=>t.domain==="cover"&&lc(t.name).includes(r.key));
    const temp=tiles.find(t=>t.domain==="sensor"&&t.device_class==="temperature"&&lc(t.name).includes(r.key));
    const ctrl=light||cover;
    const on=light?light.on:(cover?cover.state!=="closed":false);
    return {...r, ctrl, on, temp};
  });
  let svg='<div class="fp"><svg viewBox="0 0 508 500" role="img" aria-label="Floor plan">';
  svg+='<rect x="6" y="6" width="496" height="482" rx="14" fill="none" stroke="var(--line)" stroke-width="3"/>';
  rooms.forEach((r,i)=>{
    svg+=`<g class="room${r.on?' on':''}" data-i="${i}">`+
      `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10"/>`+
      `<text class="rname" x="${r.x+14}" y="${r.y+26}">${esc(r.name)}</text>`+
      (r.temp?`<text class="rtemp" x="${r.x+14}" y="${r.y+46}">${esc(r.temp.state)}${esc(r.temp.unit||"°")}</text>`:"")+
      (r.ctrl?`<circle class="rdot" cx="${r.x+r.w-16}" cy="${r.y+16}" r="6"/>`:"")+
    '</g>';
  });
  svg+='</svg></div>';
  svg+='<div class="fp-note">Tap a room to toggle its light. Sample layout — your real floor plan can be dropped in later.</div>';
  body.innerHTML=svg;
  body.querySelectorAll(".room").forEach(g=>{
    const r=rooms[+g.dataset.i];
    if(r.ctrl) g.onclick=()=>toggleEntity(r.ctrl.entity_id);
    else g.style.cursor="default";
  });
}
function renderIsoView(body,h){
  body.innerHTML='<div class="page-center"><div class="ph-card"><div class="ph-ico">\u{1F3D8}️</div>'+
    '<h3>3D home</h3><p>Coming right up.</p></div></div>';
}
async function toggleEntity(eid){ resetSleep(); try{ await post("/api/ha/toggle",{entity_id:eid}); }catch(e){} setTimeout(loadHome,400); }
async function runScene(eid){ resetSleep(); try{ await post("/api/ha/toggle",{entity_id:eid}); }catch(e){} setTimeout(loadHome,500); }
async function allLightsOff(){
  resetSleep();
  const wrap=$("#home-wrap"); if(!wrap) return;
  const lights=[...wrap.querySelectorAll('.tile[data-domain="light"]')].map(el=>el.dataset.ha);
  for(const eid of lights){ try{ await post("/api/ha/service",{domain:"light",service:"turn_off",entity_id:eid}); }catch(e){} }
  setTimeout(loadHome,500);
}
async function onTileTap(el){
  resetSleep();
  const eid=el.dataset.ha, domain=el.dataset.domain;
  if(domain==="alarm_control_panel"){ openAlarmPad(el); return; }
  if(domain==="media_player"){ openRemote(el.dataset.ha, el.dataset.name); return; }
  if(el.classList.contains("ro")) return;      // sensors: nothing to do
  // optimistic flip for instant feedback
  const wasOn=el.classList.contains("on");
  if(!el.classList.contains("scene")) el.classList.toggle("on");
  try{
    await post("/api/ha/toggle",{entity_id:eid});
    setTimeout(loadHome, 400);                  // reconcile with real state
  }catch(e){ el.classList.toggle("on", wasOn); }  // revert on failure
}

/* ---- alarm PIN pad ---- */
let pinBuf="", pinTile=null;
function openAlarmPad(el){
  pinTile=el; pinBuf="";
  const armed = el.classList.contains("on");
  $("#pin-title").textContent = armed ? "Disarm alarm" : "Arm alarm";
  $("#pin-sub").textContent = armed ? "Enter your panel code" : "Arm the system (away)";
  renderPinDots();
  $("#pinpad").classList.add("on");
}
function renderPinDots(){ $("#pin-dots").textContent = "•".repeat(pinBuf.length); }
function closePinPad(){ $("#pinpad").classList.remove("on"); pinBuf=""; pinTile=null; }
async function submitPin(){
  if(!pinTile){ closePinPad(); return; }
  const armed = pinTile.classList.contains("on");
  const action = armed ? "disarm" : "arm_away";
  try{
    await post("/api/ha/alarm",{action, code:pinBuf});
    closePinPad();
    setTimeout(loadHome, 500);
  }catch(e){
    $("#pin-sub").textContent = "That didn't work — try again";
    pinBuf=""; renderPinDots();
  }
}
document.querySelectorAll("#pinpad .pin-keys button").forEach(b=>{
  b.onclick=()=>{ resetSleep();
    const k=b.dataset.k;
    if(k==="del") pinBuf=pinBuf.slice(0,-1);
    else if(k==="ok") return submitPin();
    else if(pinBuf.length<8) pinBuf+=k;
    renderPinDots();
  };
});
$("#pin-cancel").onclick=closePinPad;
$("#pinpad").onclick=(e)=>{ if(e.target.id==="pinpad") closePinPad(); };
