<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FamilyHub</title>
<style>
  :root{
    --r:14px;
    --font:"Inter","Segoe UI",system-ui,sans-serif;
    --density:1;
    --np-accent:#1db954;   /* Spotify green for the Now Playing widget */
  }
  html[data-theme="dark"]{
    --bg:#14171c; --panel:#1b1f26; --panel2:#222834; --line:#2b313b;
    --ink:#ece6da; --ink-dim:#8a8f99; --now:#e9a23b;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#e2e5ea;
    --ink:#1d2430; --ink-dim:#6b7280; --now:#e9a23b;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{ --bg:#f4f5f7; --panel:#fff; --panel2:#eef0f3; --line:#e2e5ea; --ink:#1d2430; --ink-dim:#6b7280; --now:#e9a23b; }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:var(--font);
    font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
    transition:background .3s, color .3s;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .wrap{display:grid; grid-template-columns:1fr 380px; grid-template-rows:auto 1fr; height:100vh; gap:calc(16px * var(--density)); padding:calc(20px * var(--density))}
  header{grid-column:1/3; display:flex; align-items:center; justify-content:space-between}
  .date{font-size:30px; font-weight:700; letter-spacing:-.02em}
  .date small{display:block; font-size:13px; font-weight:500; color:var(--ink-dim); letter-spacing:.18em; text-transform:uppercase; margin-top:2px}
  .right{display:flex; align-items:center; gap:18px}
  .clock{font-size:28px; font-weight:300; color:var(--ink-dim)}
  .gear{background:var(--panel); border:1px solid var(--line); color:var(--ink-dim); width:42px; height:42px; border-radius:10px; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .gear:active{transform:scale(.95)}
  .wx{display:flex; align-items:center; gap:8px; font-size:20px; color:var(--ink-dim)}
  .wx .t{font-size:24px; font-weight:600; color:var(--ink)}
  .wx .hl{font-size:13px; line-height:1.1}

  .tabs{display:flex; gap:4px; background:var(--panel); border-radius:10px; padding:4px}
  .tabs button{background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px; font-weight:600;
    padding:8px 16px; border-radius:7px; cursor:pointer; transition:.15s}
  .tabs button.active{background:var(--panel2); color:var(--ink)}

  .main{background:var(--panel); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column}
  .side{display:flex; flex-direction:column; gap:0; overflow:hidden}
  .card{background:var(--panel); border-radius:var(--r); padding:15px 18px; display:flex; flex-direction:column; min-height:0; overflow:hidden}
  .card h2{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; font-weight:600; display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none}
  .card h2 .caret{font-size:9px; letter-spacing:0; transition:transform .2s}
  .card h2 .h2r{display:flex; align-items:center; gap:10px}
  .card .addbtn{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; font-size:16px;
    font-weight:700; width:24px; height:24px; border-radius:6px; cursor:pointer; line-height:1; letter-spacing:0;
    display:flex; align-items:center; justify-content:center}
  .card .addbtn:active{transform:scale(.92)}
  .qa-input{width:100%; background:var(--panel2); border:1px solid var(--now); border-radius:8px; color:var(--ink);
    font:inherit; font-size:15px; padding:9px 11px; margin-bottom:8px}
  .card.collapsed{flex:0 0 auto !important; min-height:0}
  .card.collapsed h2{margin-bottom:0}
  .card.collapsed .body{display:none}
  .card.collapsed h2 .caret{transform:rotate(-90deg)}
  .card .body{overflow-y:auto}
  .list-row{display:flex; align-items:center; gap:11px; padding:7px 0; border-top:1px solid var(--line); cursor:pointer}
  .list-row:first-child{border-top:0}
  .box{width:20px; height:20px; border-radius:6px; border:2px solid var(--line); flex:none; transition:.15s}
  .list-row.done .box{background:var(--now); border-color:var(--now)}
  .list-row.done .label{text-decoration:line-through; color:var(--ink-dim)}
  .label{font-size:15px; flex:1}
  .qty{font-size:13px; color:var(--ink-dim)}
  .dot{width:9px; height:9px; border-radius:50%; flex:none}
  .empty{color:var(--ink-dim); font-size:14px; font-style:italic; padding:4px 0}

  /* Now Playing — Echo Show 15 style music widget */
  .np{background:linear-gradient(135deg, color-mix(in srgb, var(--np-accent) 13%, var(--panel)), var(--panel)); flex:none}
  .np h2 .np-src{font-size:10px; letter-spacing:.14em; color:var(--np-accent); font-weight:700; text-transform:uppercase}
  .np-body{display:flex; flex-direction:column; gap:11px}
  .np-top{display:flex; align-items:center; gap:13px; min-width:0}
  .np-art{width:60px; height:60px; border-radius:10px; background:var(--panel2) center/cover no-repeat; flex:none;
    box-shadow:0 4px 14px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:24px}
  .np-meta{min-width:0; flex:1}
  .np-track{font-size:17px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .np-artist{font-size:13px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
  .np-bar{height:4px; border-radius:3px; background:var(--panel2); overflow:hidden}
  .np-fill{height:100%; width:0; background:var(--np-accent); border-radius:3px; transition:width .3s linear}
  .np-times{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:-4px; font-feature-settings:"tnum" 1}
  .np-controls{display:flex; align-items:center; justify-content:center; gap:22px; padding-top:2px}
  .np-controls button{background:none; border:0; color:var(--ink); font-size:18px; cursor:pointer; line-height:1; padding:4px; opacity:.85}
  .np-controls button:active{transform:scale(.9)}
  .np-controls .np-main{width:46px; height:46px; border-radius:50%; background:var(--np-accent); color:#062b16;
    display:flex; align-items:center; justify-content:center; opacity:1;
    box-shadow:0 4px 14px color-mix(in srgb, var(--np-accent) 45%, transparent)}

  .rail{flex:1; overflow-y:auto; padding:6px 0; position:relative}
  .hour{display:grid; grid-template-columns:62px 1fr; min-height:52px; border-top:1px solid var(--line)}
  .hour:first-child{border-top:0}
  .hour .t{font-size:12px; color:var(--ink-dim); padding:8px 0 0 16px}
  .hour .slot{padding:6px 16px 6px 0; display:flex; flex-direction:column; gap:5px}
  .ev{background:var(--panel2); border-left:4px solid var(--accent,#4f86c6); border-radius:8px; padding:7px 11px; font-size:15px; font-weight:600}
  .ev .who{font-size:11px; color:var(--ink-dim); font-weight:500; text-transform:uppercase; letter-spacing:.06em}
  .nowline{position:absolute; left:62px; right:10px; height:2px; background:var(--now); box-shadow:0 0 10px var(--now); z-index:2}
  .nowline::before{content:""; position:absolute; left:-5px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--now)}

  .week{flex:1; display:grid; grid-template-columns:repeat(7,1fr); overflow:hidden}
  .wday{border-left:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden}
  .wday:first-child{border-left:0}
  .wday .head{padding:10px; text-align:center; border-bottom:1px solid var(--line); cursor:pointer}
  .wday .head .dn{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em}
  .wday .head .dd{font-size:22px; font-weight:700; margin-top:2px}
  .wday.today .head .dd{color:var(--now)}
  .wday .evs{flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:5px}
  .wev{background:var(--panel2); border-left:3px solid var(--accent,#4f86c6); border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; line-height:1.25}
  .wev .tm{display:block; font-size:10px; color:var(--ink-dim); font-weight:500}

  .month{flex:1; display:flex; flex-direction:column; padding:8px}
  .mdow{display:grid; grid-template-columns:repeat(7,1fr); padding:0 4px 8px}
  .mdow span{text-align:center; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em}
  .mgrid{flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:4px}
  .mcell{background:var(--panel2); border-radius:8px; padding:6px 8px; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; gap:3px; transition:.15s}
  .mcell.dim{opacity:.35}
  .mcell.today{outline:2px solid var(--now)}
  .mcell .num{font-size:14px; font-weight:600}
  .mdot{height:5px; border-radius:3px; background:var(--accent,#4f86c6); flex:none}
  .mev{font-size:11px; font-weight:600; line-height:1.2; padding:1px 5px; border-radius:4px; flex:none; cursor:pointer;
    background:color-mix(in srgb, var(--accent,#4f86c6) 20%, var(--panel)); border-left:3px solid var(--accent,#4f86c6);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .mev .mt{color:var(--ink-dim); font-weight:500; margin-right:3px}
  .mmore{font-size:10px; color:var(--ink-dim)}

  /* calendar nav toolbar */
  .cal-tools{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex:none}
  .cal-tools button{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; font-weight:600; border-radius:8px; cursor:pointer}
  .cal-tools .nav{display:flex; gap:6px}
  .cal-tools .nav button{width:36px; height:36px; font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center}
  .cal-tools .today{padding:0 16px; height:36px; font-size:14px}
  .cal-tools button:active{transform:scale(.95)}
  .cal-tools .period{font-size:18px; font-weight:700; letter-spacing:-.01em; margin-left:2px}
  .cal-tools .zoom{display:flex; gap:6px; margin-left:auto}
  .cal-tools .zoom button{width:36px; height:36px; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center}
  .calbody{flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0}

  /* draggable handles to resize the side panels */
  .resizer{height:10px; flex:none; cursor:row-resize; position:relative; touch-action:none}
  .resizer::before{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:42px; height:4px; border-radius:2px; background:var(--line); transition:.15s}
  .resizer:hover::before, .resizer.drag::before{background:var(--ink-dim); width:60px}

  /* day/week hourly time-grid */
  .tg{flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0}
  .tg-head{display:grid; grid-template-columns:54px repeat(var(--cols,7),1fr); flex:none; padding-right:var(--sbw,0px)}
  .tg-head .cnr{border-bottom:1px solid var(--line)}
  .tg-head .dcol{padding:7px 2px; text-align:center; cursor:pointer; border-left:1px solid var(--line); border-bottom:1px solid var(--line)}
  .tg-head .dcol .dn{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em}
  .tg-head .dcol .dd{font-size:18px; font-weight:700; margin-top:1px}
  .tg-head .dcol.today .dd{color:var(--now)}
  .tg-head .dcol .dwx{font-size:11px; color:var(--ink-dim); margin-top:2px; white-space:nowrap}
  .tg-allday{display:grid; grid-template-columns:54px repeat(var(--cols,7),1fr); flex:none; border-bottom:1px solid var(--line); max-height:78px; overflow-y:auto; padding-right:var(--sbw,0px)}
  .tg-allday .lbl{font-size:9px; color:var(--ink-dim); padding:5px 4px 0; text-transform:uppercase; text-align:right; letter-spacing:.04em}
  .tg-allday .adcol{border-left:1px solid var(--line); padding:3px; display:flex; flex-direction:column; gap:3px; min-height:24px}
  .adev{font-size:11px; font-weight:600; background:color-mix(in srgb, var(--accent,#4f86c6) 20%, var(--panel)); border-left:3px solid var(--accent,#4f86c6); border-radius:5px; padding:2px 6px; cursor:pointer; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
  .tg-body{flex:1; overflow-y:auto; position:relative; min-height:0; scrollbar-gutter:stable}
  .tg-cols{display:grid; grid-template-columns:54px repeat(var(--cols,7),1fr); position:relative}
  .tg-gut .gh{height:var(--hpx,46px); font-size:11px; color:var(--ink-dim); text-align:right; padding-right:7px; transform:translateY(-7px)}
  .tg-day{position:relative; border-left:1px solid var(--line);
    background-image:repeating-linear-gradient(var(--line) 0 1px, transparent 1px var(--hpx,46px))}
  .tg-ev{position:absolute; left:3px; right:3px; background:color-mix(in srgb, var(--accent,#4f86c6) 20%, var(--panel));
    border-left:3px solid var(--accent,#4f86c6);
    border-radius:6px; padding:3px 7px; font-size:11px; font-weight:600; line-height:1.18; overflow:hidden; cursor:pointer}
  .tg-ev .tm{display:block; font-size:9px; color:var(--ink-dim); font-weight:500}
  .tg-now{position:absolute; height:2px; background:var(--now); box-shadow:0 0 8px var(--now); z-index:3; pointer-events:none}
  .tg-now::before{content:""; position:absolute; left:-4px; top:-3px; width:9px; height:9px; border-radius:50%; background:var(--now)}

  #sleep{position:fixed; inset:0; background:#000; z-index:50; opacity:0; pointer-events:none; transition:opacity 1.2s}
  #sleep.on{opacity:1; pointer-events:auto}
  #sleep img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 2s}
  #sleep img.show{opacity:1}
  #sleep .ovl{position:absolute; left:40px; bottom:40px; z-index:2; text-shadow:0 2px 20px #000}
  #sleep .ovl .t{font-size:64px; font-weight:200; color:#fff}
  #sleep .ovl .d{font-size:20px; color:#ddd; margin-top:4px}

  /* settings drawer */
  #settings-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; opacity:0; pointer-events:none; transition:.25s}
  #settings-overlay.on{opacity:1; pointer-events:auto}
  #settings-drawer{position:fixed; top:0; right:0; bottom:0; width:380px; max-width:90vw; background:var(--panel);
    border-left:1px solid var(--line); z-index:61; transform:translateX(100%); transition:transform .28s;
    padding:24px; overflow-y:auto}
  #settings-drawer.on{transform:translateX(0)}
  .sd-title{font-size:22px; font-weight:700; margin-bottom:20px}
  .sd-group{margin-bottom:22px}
  .sd-group>label{display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); font-weight:600; margin-bottom:10px}
  .sd-seg{display:flex; flex-wrap:wrap; gap:6px}
  .sd-seg button{flex:1; min-width:72px; background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim);
    font:inherit; font-size:14px; font-weight:600; padding:10px 8px; border-radius:9px; cursor:pointer}
  .sd-seg button.active{background:var(--now); border-color:var(--now); color:#1a1205}
  .sd-people-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
  .sd-people-row:first-child{border-top:0}
  .sd-people-row .pdot{width:18px; height:18px; border-radius:50%; flex:none; cursor:pointer}
  .sd-people-row .pname{flex:1; font-size:15px; cursor:pointer}
  .sd-people-row .pdel{background:none; border:0; color:var(--ink-dim); font-size:18px; cursor:pointer; padding:2px 6px}
  .np-name{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink);
    font:inherit; font-size:15px; padding:11px; margin:10px 0}
  .sd-addbtn{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit;
    font-size:14px; font-weight:600; padding:11px; border-radius:10px; cursor:pointer; margin-top:10px}
  .sd-colors{display:flex; gap:10px; flex-wrap:wrap}
  .sd-colors .sw{width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer}
  .sd-colors .sw.sel{border-color:var(--ink); transform:scale(1.1)}
  .sd-toggles{display:flex; flex-direction:column; gap:12px}
  .sd-hours{display:flex; align-items:center; gap:10px}
  .sd-hours select{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    font:inherit; font-size:15px; font-weight:600; padding:10px; border-radius:9px; cursor:pointer}
  .sd-hours span{color:var(--ink-dim); font-size:13px}
  .sd-toggles label{display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer}
  .sd-fx-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
  .sd-fx-row label{flex:1; display:flex; align-items:center; gap:10px; font-size:15px; cursor:pointer}
  .sd-fx-row input{width:20px; height:20px; accent-color:var(--now)}
  .sd-fx-row .prev{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit;
    font-size:13px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer}
  .sd-toggles input{width:20px; height:20px; accent-color:var(--now)}
  .sd-close{width:100%; background:var(--now); color:#1a1205; border:0; border-radius:12px; font:inherit;
    font-size:16px; font-weight:700; padding:14px; cursor:pointer; margin-top:8px}

  /* event editor modal */
  #ev-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:70; opacity:0; pointer-events:none; transition:.2s}
  #ev-overlay.on{opacity:1; pointer-events:auto}
  #ev-modal{position:fixed; top:50%; left:50%; transform:translate(-50%,-46%); width:420px; max-width:92vw;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; z-index:71;
    opacity:0; pointer-events:none; transition:.2s}
  #ev-modal.on{opacity:1; pointer-events:auto; transform:translate(-50%,-50%)}
  .ev-title{font-size:20px; font-weight:700; margin-bottom:16px}
  #ev-modal input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font:inherit; font-size:16px; padding:12px; margin-bottom:11px}
  #ev-modal textarea{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font:inherit; font-size:15px; padding:12px; margin-bottom:11px; resize:vertical; min-height:58px}
  .ev-two{display:flex; gap:10px}
  .ev-two input{flex:1}
  .ev-actions{display:flex; gap:10px; margin-top:6px}
  .ev-del{flex:1; background:var(--panel2); border:1px solid var(--line); color:#e0533d; font:inherit;
    font-size:15px; font-weight:600; padding:13px; border-radius:11px; cursor:pointer}
  .ev-save{flex:2; background:var(--now); border:0; color:#1a1205; font:inherit; font-size:15px;
    font-weight:700; padding:13px; border-radius:11px; cursor:pointer}
  .ev-cancel{width:100%; background:none; border:0; color:var(--ink-dim); font:inherit; font-size:14px;
    padding:12px 0 0; cursor:pointer}
  .ev-chk{display:flex; align-items:center; gap:10px; font-size:15px; margin-bottom:11px; cursor:pointer; color:var(--ink)}
  .ev-chk input{width:20px; height:20px; accent-color:var(--now)}
  .ev-field{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px}
  .ev-field label{font-size:13px; color:var(--ink-dim); font-weight:600}
  #ev-modal select{background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink);
    font:inherit; font-size:15px; padding:10px; flex:1; max-width:62%}
  .ev-colors{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex:1}
  .ev-colors .sw{width:28px; height:28px; border-radius:50%; border:3px solid transparent; cursor:pointer}
  .ev-colors .sw.sel{border-color:var(--ink); transform:scale(1.12)}
  #ev-recur-box{border-top:1px solid var(--line); margin-top:4px; padding-top:13px}
  .ev-mlabel{display:block; font-size:13px; color:var(--ink-dim); font-weight:600; margin-bottom:8px}
  .ev-mrow{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
  .ev-mrow button{background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim); font:inherit;
    font-size:12px; font-weight:600; padding:8px 0; border-radius:8px; cursor:pointer}
  .ev-mrow button.on{background:#e0533d; border-color:#e0533d; color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="date">—<small id="dow">loading</small></div>
    <div class="right">
      <div class="tabs">
        <button data-v="day">Day</button>
        <button data-v="week" class="active">Week</button>
        <button data-v="month">Month</button>
      </div>
      <div class="clock" id="clock">--:--</div>
      <div class="wx" id="wx"></div>
      <button class="gear" id="gear" title="Settings">&#9881;</button>

<script src="/theme.js"></script>

<script>
const $ = s => document.querySelector(s);
let view = "week";
let cursor = new Date();              // the date the calendar is centered on
let cache = {events:[], dash:null};
let people = [];   // family members, from the dashboard feed
let forecast = {}; // date 'YYYY-MM-DD' -> {high, low, icon, desc}
let START_HOUR = 6, END_HOUR = 20;   // visible window, overridden by settings
let HOURPX = 46;                     // zoom level (hour-row height), from settings
const ZOOM_MIN = 26, ZOOM_MAX = 120;
function syncHours(){
  const s = FH.get();
  let a = parseInt(s.dayStart, 10); if(isNaN(a)) a = 6;
  let b = parseInt(s.dayEnd, 10);   if(isNaN(b)) b = 20;
  a = Math.min(Math.max(a, 0), 23);
  b = Math.min(Math.max(b, a + 1), 24);   // end always after start
  START_HOUR = a; END_HOUR = b;
  let z = parseInt(s.hourPx, 10); if(isNaN(z)) z = 46;
  HOURPX = Math.min(Math.max(z, ZOOM_MIN), ZOOM_MAX);
}
function zoom(dir){
  HOURPX = Math.min(Math.max(HOURPX + dir*10, ZOOM_MIN), ZOOM_MAX);
  FH.save({hourPx:HOURPX}); render();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function evStart(ev){ // local Date; date-only all-day strings parsed in local tz (no UTC shift)
  const s=ev.start; if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  return new Date(s);
}

function tick(){
  const n=new Date();
  const hm=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  $("#clock").textContent=hm; $("#sclock").textContent=hm;
  $("#date").firstChild.textContent=n.toLocaleDateString([],{month:"long",day:"numeric"});
  $("#dow").textContent=n.toLocaleDateString([],{weekday:"long",year:"numeric"});
  $("#sdate").textContent=n.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
  placeNow();
}

document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{ setActive(b.dataset.v); view=b.dataset.v; render(); resetSleep(); };
});
function setActive(v){ document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.v===v)); }

function render(){
  syncHours();
  updatePeriod();
  if(view==="day") renderGrid([new Date(cursor)]);
  else if(view==="week") renderGrid(weekDays(cursor));
  else renderMonth();
}
function evColor(ev){ return ev.color || "#4f86c6"; }
function weekDays(d){ const s=weekStart(d); return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x;}); }
function hourLabel(h){ const hh=h%24; return (hh%12||12)+(hh<12?'am':'pm'); }

function renderGrid(daysArr){
  const body=$("#calbody"); const cols=daysArr.length; const hrs=END_HOUR-START_HOUR;
  let head='<div class="cnr"></div>';
  daysArr.forEach(d=>{
    const wx=forecast[dateStr(d)];
    const wxhtml = wx ? `<div class="dwx">${wx.icon} ${wx.high}°/${wx.low}°</div>` : "";
    head+=`<div class="dcol${sameDay(d,new Date())?' today':''}" data-iso="${d.toISOString()}">`
        +`<div class="dn">${d.toLocaleDateString([],{weekday:'short'})}</div>`
        +`<div class="dd">${d.getDate()}</div>${wxhtml}</div>`;
  });
  let allday='<div class="lbl">all-day</div>';
  daysArr.forEach(d=>{
    let cell='';
    cache.events.filter(e=>e.all_day && sameDay(evStart(e),d)).forEach(ev=>{
      cell+=`<div class="adev" data-id="${encodeURIComponent(ev.id||'')}" style="--accent:${evColor(ev)}">${esc(ev.title)}</div>`;
    });
    allday+=`<div class="adcol">${cell}</div>`;
  });
  let gut=''; for(let h=START_HOUR;h<END_HOUR;h++) gut+=`<div class="gh">${hourLabel(h)}</div>`;
  let dayCols=''; daysArr.forEach((d,i)=> dayCols+=`<div class="tg-day" data-col="${i}"></div>`);
  body.innerHTML=
    `<div class="tg" style="--cols:${cols};--hpx:${HOURPX}px">`
    +`<div class="tg-head">${head}</div>`
    +`<div class="tg-allday">${allday}</div>`
    +`<div class="tg-body"><div class="tg-cols" id="tgcols" style="height:${hrs*HOURPX}px">`
    +`<div class="tg-gut">${gut}</div>${dayCols}</div></div></div>`;
  // place timed events into each day column
  daysArr.forEach((d,i)=>{
    const col=body.querySelector(`.tg-day[data-col="${i}"]`);
    // tap an empty slot to create an event at that hour
    col.onclick=(e)=>{ if(e.target!==col) return;
      const y=e.clientY-col.getBoundingClientRect().top;
      const hour=Math.min(END_HOUR-1, Math.max(START_HOUR, START_HOUR+Math.floor(y/HOURPX)));
      openCreate(d, `${pad(hour)}:00`); resetSleep();
    };
    cache.events.filter(e=>!e.all_day && sameDay(evStart(e),d)).forEach(ev=>{
      const sdt=evStart(ev); if(!sdt||isNaN(sdt))return;
      const sh=sdt.getHours()+sdt.getMinutes()/60; if(sh>=END_HOUR)return;
      const edt=ev.end?new Date(ev.end):null;
      const dur=(edt&&!isNaN(edt))?Math.max((edt-sdt)/3600000,0.25):1;
      const top=Math.max(0,sh-START_HOUR)*HOURPX;
      const h=Math.max(16,Math.min(dur,END_HOUR-Math.max(sh,START_HOUR))*HOURPX);
      const el=document.createElement("div"); el.className="tg-ev"; el.style.setProperty("--accent",evColor(ev));
      el.style.top=top+"px"; el.style.height=h+"px";
      el.innerHTML=`<span class="tm">${sdt.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</span>${esc(ev.title)}`;
      el.onclick=(e)=>{e.stopPropagation();openEditor(ev);};
      col.appendChild(el);
    });
  });
  // all-day chips clickable
  body.querySelectorAll(".adev").forEach(el=>{
    el.onclick=(e)=>{ e.stopPropagation(); const id=decodeURIComponent(el.dataset.id);
      const ev=cache.events.find(x=>String(x.id||'')===id && x.all_day); if(ev)openEditor(ev); };
  });
  // day header → jump into that day
  body.querySelectorAll(".dcol").forEach(el=>{
    el.onclick=()=>{ cursor=new Date(el.dataset.iso); view="day"; setActive("day"); render(); };
  });
  // current-time line, only when the visible range includes today
  if(daysArr.some(d=>sameDay(d,new Date()))){
    const line=document.createElement("div"); line.className="tg-now"; line.style.left="54px"; line.style.right="0";
    $("#tgcols").appendChild(line); placeNow();
  }
  // open scrolled near the workday / now
  const tb=body.querySelector(".tg-body");
  if(tb){ const nh=Math.min(Math.max(new Date().getHours(),START_HOUR),END_HOUR);
    tb.scrollTop=Math.max(0,(nh-START_HOUR-1))*HOURPX; }
}
function placeNow(){
  const cols=$("#tgcols"); if(!cols)return; const line=cols.querySelector(".tg-now"); if(!line)return;
  const n=new Date(); const h=n.getHours()+n.getMinutes()/60;
  if(h<START_HOUR||h>END_HOUR){ line.style.display="none"; return; }
  line.style.display=""; line.style.top=((h-START_HOUR)*HOURPX)+"px";
}

function renderMonth(){
  const body=$("#calbody");
  body.innerHTML='<div class="month"><div class="mdow"></div><div class="mgrid" id="mgrid"></div></div>';
  const dow=body.querySelector(".mdow");
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{const s=document.createElement("span");s.textContent=d;dow.appendChild(s);});
  const grid=$("#mgrid"); const ref=new Date(cursor);
  const first=new Date(ref.getFullYear(),ref.getMonth(),1);
  const gridStart=new Date(first); gridStart.setDate(1-first.getDay());
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const cell=document.createElement("div");
    cell.className="mcell"+(d.getMonth()!==ref.getMonth()?" dim":"")+(sameDay(d,new Date())?" today":"");
    cell.innerHTML=`<div class="num">${d.getDate()}</div>`;
    const dayEvs=cache.events.filter(e=>sameDay(evStart(e),d))
      .sort((a,b)=>(a.all_day?0:1)-(b.all_day?0:1) || (a.start||"").localeCompare(b.start||""));
    dayEvs.slice(0,3).forEach(ev=>{
      const chip=document.createElement("div"); chip.className="mev"; chip.style.setProperty("--accent",evColor(ev));
      const sdt=evStart(ev); const tm=(!ev.all_day && sdt && !isNaN(sdt)) ? sdt.toLocaleTimeString([],{hour:"numeric"}) : "";
      chip.innerHTML=`${tm?`<span class="mt">${tm}</span>`:""}${esc(ev.title)}`;
      chip.onclick=(e)=>{ e.stopPropagation(); openEditor(ev); };
      cell.appendChild(chip);
    });
    if(dayEvs.length>3){const m=document.createElement("div");m.className="mmore";m.textContent=`+${dayEvs.length-3} more`;cell.appendChild(m);}
    cell.onclick=()=>{ cursor=new Date(d); view="day"; setActive("day"); render(); };
    grid.appendChild(cell);
  }
}

function updatePeriod(){
  const p=$("#period"); if(!p)return;
  if(view==="day"){ p.textContent=cursor.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"}); }
  else if(view==="week"){ const ds=weekDays(cursor), a=ds[0], b=ds[6];
    const m1=a.toLocaleDateString([],{month:"short"}), m2=b.toLocaleDateString([],{month:"short"});
    p.textContent = (m1===m2) ? `${m1} ${a.getDate()} – ${b.getDate()}` : `${m1} ${a.getDate()} – ${m2} ${b.getDate()}`;
  } else { p.textContent=cursor.toLocaleDateString([],{month:"long",year:"numeric"}); }
}
function navStep(dir){
  const c=new Date(cursor);
  if(view==="day") c.setDate(c.getDate()+dir);
  else if(view==="week") c.setDate(c.getDate()+7*dir);
  else c.setMonth(c.getMonth()+dir);
  cursor=c; render();
}
$("#nav-prev").onclick=()=>{ navStep(-1); resetSleep(); };
$("#nav-next").onclick=()=>{ navStep(1); resetSleep(); };
$("#nav-today").onclick=()=>{ cursor=new Date(); render(); resetSleep(); };
$("#zoom-in").onclick=()=>{ zoom(1); resetSleep(); };
$("#zoom-out").onclick=()=>{ zoom(-1); resetSleep(); };

/* swipe left/right on the calendar to change week/month/day; pinch to zoom */
(function enableTouch(){
  const el=$("#calbody"); if(!el) return;
  let x0=null,y0=null,pinch0=null,px0=null;
  el.addEventListener("touchstart",e=>{
    if(e.touches.length===2){ pinch0=dist(e.touches); px0=HOURPX; x0=null; }
    else { const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; }
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(pinch0!==null && e.touches.length===2){
      const f=dist(e.touches)/pinch0;
      HOURPX=Math.min(Math.max(Math.round(px0*f),ZOOM_MIN),ZOOM_MAX); render();
    }
  },{passive:true});
  el.addEventListener("touchend",e=>{
    if(pinch0!==null){ pinch0=null; FH.save({hourPx:HOURPX}); resetSleep(); return; }
    if(x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ navStep(dx<0?1:-1); resetSleep(); }
    x0=y0=null;
  },{passive:true});
  function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
})();

/* drag the handles between side panels to resize them */
(function enablePanelResize(){
  document.querySelectorAll(".resizer").forEach(rz=>{
    const ai=+rz.dataset.above, bi=+rz.dataset.below;
    const cards=[$("#panel-todos"),$("#panel-groceries"),$("#panel-meals")];
    let y0,fa0,fb0,h;
    const down=(e)=>{
      e.preventDefault(); rz.classList.add("drag");
      const p=e.touches?e.touches[0]:e; y0=p.clientY; h=$(".side").clientHeight;
      const sz=panelSizes(); fa0=sz[ai]; fb0=sz[bi];
      window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
    };
    const move=(e)=>{
      const p=e.touches?e.touches[0]:e; const dPx=p.clientY-y0;
      const dFlex=(dPx/h)*(fa0+fb0);            // convert pixels to flex units
      let fa=Math.max(0.25, fa0+dFlex), fb=Math.max(0.25, fb0-dFlex);
      const sz=panelSizes(); sz[ai]=fa; sz[bi]=fb; applyPanelSizes(sz);
    };
    const up=()=>{
      rz.classList.remove("drag");
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
      FH.save({panelSizes:panelSizes()}); resetSleep();
    };
    rz.addEventListener("pointerdown",down);
  });
})();
function panelSizes(){
  const cards=[$("#panel-todos"),$("#panel-groceries"),$("#panel-meals")];
  return cards.map(c=>parseFloat(c.style.flexGrow)|| (FH.get().panelSizes||[1.1,1.1,.9])[cards.indexOf(c)] || 1);
}
function applyPanelSizes(sz){
  const cards=[$("#panel-todos"),$("#panel-groceries"),$("#panel-meals")];
  cards.forEach((c,i)=>{ c.style.flexGrow=sz[i]; c.style.flexShrink=1; c.style.flexBasis="0"; });
}

function renderTodos(todos){
  const box=$("#todos"); box.innerHTML="";
  if(!todos.length){box.innerHTML='<div class="empty">Nothing to do</div>';return;}
  todos.forEach(t=>{
    const row=document.createElement("div"); row.className="list-row"+(t.done?" done":"");
    row.innerHTML=`<div class="box"></div><span class="dot" style="background:${t.color||'#4f86c6'}"></span><div class="label">${t.title}</div>`;
    row.onclick=async()=>{await fetch(`/api/todos/${t.id}/toggle`,{method:"POST"});load();resetSleep();};
    box.appendChild(row);
  });
}
function renderGroceries(items){
  const box=$("#groceries"); box.innerHTML="";
  if(!items.length){box.innerHTML='<div class="empty">List is empty</div>';return;}
  items.forEach(g=>{
    const row=document.createElement("div"); row.className="list-row"+(g.got?" done":"");
    row.innerHTML=`<div class="box"></div><span class="dot" style="background:${g.color||'#4f86c6'}"></span><div class="label">${g.item}</div>${g.qty?`<div class="qty">${g.qty}</div>`:""}`;
    row.onclick=async()=>{await fetch(`/api/groceries/${g.id}/toggle`,{method:"POST"});load();resetSleep();};
    box.appendChild(row);
  });
}
function renderMeals(meals){
  const box=$("#meals"); box.innerHTML="";
  const today=new Date().toISOString().slice(0,10);
  const t=meals.filter(m=>m.date===today);
  if(!t.length){box.innerHTML='<div class="empty">No meals planned</div>';return;}
  t.forEach(m=>{
    const row=document.createElement("div"); row.className="list-row";
    row.innerHTML=`<span class="dot" style="background:${m.color||'#4f86c6'}"></span><div class="label">${m.title}</div><div class="qty">${m.slot}</div>`;
    box.appendChild(row);
  });
}

function startQuickAdd(kind){
  const map={todo:"todos", grocery:"groceries", meal:"meals"};
  const box=$("#"+map[kind]); if(!box) return;
  box.closest(".card").classList.remove("collapsed");       // make sure it's open

  const inp=document.createElement("input"); inp.className="qa-input";
  inp.placeholder = kind==="grocery"?"Add item, press Enter…" : kind==="meal"?"Add tonight's meal…" : "Add a to-do…";
  box.prepend(inp); inp.focus();
  const submit=async()=>{
    const v=inp.value.trim(); if(!v){ inp.remove(); return; }
    if(kind==="todo") await post("/api/todos/",{title:v}).catch(()=>{});
    else if(kind==="grocery") await post("/api/groceries/",{item:v}).catch(()=>{});

  inp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } else if(e.key==="Escape") inp.remove(); };

function buildRecFromUI(){
  const base=$("#ev-repeat").value; if(!base) return null;
  let s=base;
  const mode=$("#ev-endmode").value;
  if(mode==="count") s+=`;count=${Math.max(1,parseInt($("#ev-count").value)||1)}`;
  else if(mode==="until" && $("#ev-until").value) s+=`;until=${$("#ev-until").value}`;
  const ex=[...document.querySelectorAll("#ev-month-row button.on")].map(b=>b.dataset.m);
  if(ex.length) s+=`;exmonths=${ex.join(",")}`;
  return s;
}
function parseRecToUI(rec){
  $("#ev-repeat").value=""; $("#ev-endmode").value="never"; $("#ev-count").value=3; $("#ev-until").value="";
  document.querySelectorAll("#ev-month-row button").forEach(b=>b.classList.remove("on"));
  if(rec){
    const [base,...mods]=rec.split(";");
    $("#ev-repeat").value=base.trim();
    mods.forEach(m=>{ const [k,v]=m.split("=");
      if(k==="count"){ $("#ev-endmode").value="count"; $("#ev-count").value=v; }
      else if(k==="until"){ $("#ev-endmode").value="until"; $("#ev-until").value=v; }
      else if(k==="exmonths"){ v.split(",").forEach(mm=>{ const b=document.querySelector(`#ev-month-row button[data-m="${mm}"]`); if(b)b.classList.add("on"); }); }
    });
  }
  updateRecurUI();
}

function openEditor(ev){
  // Every event opens a popup. Holidays/demo are read-only; local events are
  // fully editable (incl. recurrence); Google/iCloud events edit title+time.
  const isLocal = ev.source==="local";
  const isCal = ev.source==="google" || ev.source==="caldav" || ev.source==="icloud";
  const editable = !!ev.id && (isLocal || isCal);
  modalMode = !editable ? "view" : isLocal ? "edit-local"
            : (ev.source==="caldav"||ev.source==="icloud") ? "edit-icloud" : "edit-google";
  editing = editable ? ev : null;
  $(".ev-title").textContent = editable ? "Edit event" : (ev.title||"Event");
  $("#ev-name").value=ev.title||"";
  const d=ev.start?evStart(ev):new Date(); const valid=d&&!isNaN(d);
  $("#ev-allday").checked=!!ev.all_day;
  $("#ev-date").value=valid?dateStr(d):"";
  $("#ev-time").value=(ev.all_day||!valid)?"":d.toTimeString().slice(0,5);
  $("#ev-dur").value="60";
  $("#ev-name").disabled=$("#ev-date").disabled=$("#ev-time").disabled=$("#ev-allday").disabled=!editable;
  $("#ev-desc").value=ev.description||""; $("#ev-desc").disabled=!editable;
  $("#ev-desc").style.display=(editable||ev.description)?"":"none";
  chosenEvColor = editable ? (ev.color || null) : null; syncEvColors();
  $("#ev-color-row").style.display = editable ? "flex" : "none";
  fillPersonOptions(ev.person_id); $("#ev-person-row").style.display = editable ? "flex" : "none";
  if(modalMode==="edit-local"){ $("#ev-recur-box").style.display=""; parseRecToUI(ev.recurrence); }
  else { $("#ev-recur-box").style.display="none"; }
  updateAllDayUI();
  $("#ev-del").style.display=editable?"":"none";
  $("#ev-save").style.display=editable?"":"none";
  $("#ev-modal").classList.add("on"); $("#ev-overlay").classList.add("on");
}
function closeEditor(){ editing=null; modalMode="view"; $("#ev-modal").classList.remove("on"); $("#ev-overlay").classList.remove("on"); }

function eventTimes(){
  const allday=$("#ev-allday").checked;
  const date=$("#ev-date").value || dateStr(new Date());
  if(allday) return {start:date, end:nextDayStr(date), all_day:true};
  const time=$("#ev-time").value||"09:00";
  const start=`${date}T${time}:00`;
  return {start, end:plusMinutesLocal(start, parseInt($("#ev-dur").value)||60), all_day:false};
}
$("#ev-save").onclick=async()=>{
  const title=$("#ev-name").value.trim(); if(!title) return;
  const t=eventTimes();
  const personId = $("#ev-person").value ? parseInt($("#ev-person").value) : null;
  const desc = $("#ev-desc").value.trim() || null;
  try{
    if(modalMode==="create"){

      await fetch("/api/calendar/events",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title, start:t.start, end:t.end, all_day:t.all_day, description:desc,
          recurrence:buildRecFromUI(), color:chosenEvColor, person_id:personId, target:"auto"})});
    } else if(modalMode==="edit-local"){
      await fetch(`/api/events/${editing.id}`,{method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title, start:t.start, end:t.end, all_day:t.all_day, description:desc, recurrence:buildRecFromUI(),
          person_id:personId, category_id:editing.category_id, color:chosenEvColor})});
    } else if(editing){
      const target = modalMode==="edit-icloud" ? "icloud" : "google";
      await fetch("/api/calendar/events",{method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({event_id:editing.id, title, start:t.start, end:t.end, description:desc, color:chosenEvColor, target})});
    }
  }catch(e){}
  closeEditor(); load();
};
$("#ev-del").onclick=async()=>{
  try{
    if(modalMode==="edit-local" && editing){
      await fetch(`/api/events/${editing.id}`,{method:"DELETE"});

      const target = modalMode==="edit-icloud" ? "icloud" : "google";

    $("#np-artist").textContent = m.artist || "";
    const art = $("#np-art");
    if(m.art_url){ art.style.backgroundImage=`url("${m.art_url}")`; art.classList.remove("noart"); art.textContent=""; }
    else { art.style.backgroundImage=""; art.classList.add("noart"); art.innerHTML="&#9835;"; }
    np = {is_playing:!!m.is_playing, progress_ms:m.progress_ms||0, duration_ms:m.duration_ms||0, at:Date.now()};
    $("#np-play").innerHTML = m.is_playing ? "&#10074;&#10074;" : "&#9654;";
    paintProgress();
  }catch(e){ card.style.display="none"; }
}
function fmtMs(ms){ const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function paintProgress(){
  if($("#panel-np").style.display==="none") return;
  let prog = np.progress_ms + (np.is_playing ? Date.now()-np.at : 0);
  if(np.duration_ms) prog = Math.min(prog, np.duration_ms);
  const pct = np.duration_ms ? (prog/np.duration_ms*100) : 0;
  $("#np-fill").style.width = pct+"%";
  $("#np-cur").textContent = fmtMs(prog);
  $("#np-dur").textContent = fmtMs(np.duration_ms);
}
async function musicCmd(path){
  try{ await fetch("/api/music/"+path,{method:"POST"}); }catch(e){}
  setTimeout(loadMusic, 350);   // let Spotify settle, then re-sync
}
$("#np-prev").onclick=()=>{ musicCmd("previous"); resetSleep(); };
$("#np-next").onclick=()=>{ musicCmd("next"); resetSleep(); };
$("#np-play").onclick=()=>{
  const cur = np.progress_ms + (np.is_playing ? Date.now()-np.at : 0);   // freeze at displayed spot
  const willPlay = !np.is_playing;
  np = {...np, is_playing:willPlay, progress_ms:cur, at:Date.now()};
  $("#np-play").innerHTML = willPlay ? "&#10074;&#10074;" : "&#9654;";   // optimistic
  musicCmd(willPlay ? "play" : "pause"); resetSleep();
};

/* measure the OS scrollbar width so the calendar header/all-day row reserve the
   same gutter as the scrolling body, keeping day columns aligned */
(function(){
  const d=document.createElement("div");
  d.style.cssText="overflow:scroll;width:60px;height:60px;position:absolute;top:-9999px;visibility:hidden";
  document.body.appendChild(d);
  document.documentElement.style.setProperty("--sbw",(d.offsetWidth-d.clientWidth)+"px");
  d.remove();
})();

/* ---- boot ---- */
(async()=>{
  await FH.load();
  applyPanels();
  applySeasonal();
  tick(); load(); loadPhotos(); loadWeather(); loadForecast(); loadMusic(); checkNotifications(); resetSleep();
  setInterval(tick,1000); setInterval(load,60000); setInterval(loadPhotos,300000);
  setInterval(loadWeather, 600000);   // weather every 10 min
  setInterval(loadForecast, 1800000); // forecast every 30 min
  setInterval(loadMusic, 5000);       // now playing every 5s
  setInterval(paintProgress, 1000);   // smooth progress between polls
  setInterval(checkNotifications, 30000);  // reminders every 30s
})();
</script>
