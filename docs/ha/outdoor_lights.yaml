# FamilyHub — outdoor + holiday light schedules, moved from Alarm.com (Nov 2026)
#
# EVERYTHING HERE IS CHANGEABLE WITHOUT EDITING THIS FILE: phone > FamilyHub > Settings > Automations
# (or tap the matching entity in Home Assistant):
#   - which lights are the nightly lights, the holiday plug, and the Christmas window lights (pick from a list)
#   - the holiday switch-over time (11:50 PM) and the Christmas windows-off time (10:30 PM)
#   - Halloween / Christmas on or off, the last day of Christmas lights in January, "holiday lights tonight"
# Starting values are filled in once on the first start (fh_outdoor_defaults); after that your changes are kept.
#
# What it does
#   Sunset:        holiday season -> holiday plug on (nightly lights wait for the switch-over time);
#                  otherwise the nightly lights (porch, driveway, side door) on.
#   Switch-over:   holiday season -> holiday plug off, nightly lights on for the rest of the night.
#   Sunrise:       everything outside off.
#   Christmas:     window lights on at sunset, off at the windows-off time.
#   Seasons:       Halloween = October. Christmas = day after Thanksgiving through the chosen day in January.
#
# Replaces these Alarm.com schedules (turn them OFF in the Alarm.com app): Halloween/Christmas Outdoor Lights,
# Regular Outdoor Lights Halloween/Christmas, Front Lights Sunset/rise, Christmas Lights Upstairs.
#
# INSTALL: put this file in the packages folder (/homeassistant/packages in the Terminal add-on) and restart.

input_boolean:
  holiday_lights_force: { name: Holiday lights tonight (outside the season), icon: mdi:string-lights }
  fh_outdoor_halloween: { name: Halloween lights in October, icon: mdi:halloween }
  fh_outdoor_christmas: { name: Christmas lights (Thanksgiving to January), icon: mdi:pine-tree }
  fh_outdoor_ready:     { name: Outdoor starting values filled in (automatic) }

input_datetime:
  fh_outdoor_switchover:   { name: Holiday lights off / nightly lights on at, has_date: false, has_time: true }
  fh_outdoor_windows_off:  { name: Christmas window lights off at, has_date: false, has_time: true }
  # leave empty (or any date before November) for "the day after Thanksgiving"; the year is ignored
  fh_outdoor_xmas_start:   { name: Christmas lights start on, has_date: true, has_time: false }

input_number:
  fh_outdoor_xmas_last_day: { name: Christmas lights last day in January, min: 1, max: 31, step: 1, mode: box, icon: mdi:calendar-end }

input_text:
  fh_outdoor_night_lights:   { name: Nightly lights, max: 255 }
  fh_outdoor_holiday_lights: { name: Holiday lights, max: 255 }
  fh_outdoor_window_lights:  { name: Christmas window lights, max: 255 }

template:
  - binary_sensor:
      - name: Halloween season
        unique_id: fh_halloween_season
        state: "{{ now().month == 10 and is_state('input_boolean.fh_outdoor_halloween', 'on') }}"
      - name: Christmas season
        unique_id: fh_christmas_season
        # starts on the chosen date (month + day), or the day after Thanksgiving (4th Thursday of November)
        state: >
          {% set n1 = now().replace(month=11, day=1) %}
          {% set tg = 1 + ((3 - n1.weekday()) % 7) + 21 %}
          {% set last = states('input_number.fh_outdoor_xmas_last_day') | int(6) %}
          {% set st = states('input_datetime.fh_outdoor_xmas_start') %}
          {% set sm = st[5:7] | int(0) if st | length >= 10 else 0 %}
          {% set sd = st[8:10] | int(0) if st | length >= 10 else 0 %}
          {% set start = (sm, sd) if sm in [11, 12] else (11, tg + 1) %}
          {% set md = (now().month, now().day) %}
          {{ is_state('input_boolean.fh_outdoor_christmas', 'on') and
             ((now().month in [11, 12] and md >= start) or (now().month == 1 and now().day <= last)) }}
      - name: Holiday lights season
        unique_id: fh_holiday_lights_season
        state: >
          {{ is_state('binary_sensor.halloween_season', 'on') or is_state('binary_sensor.christmas_season', 'on')
             or is_state('input_boolean.holiday_lights_force', 'on') }}

script:
  # Turn every light/plug listed in one of the lists above on or off.
  fh_outdoor_set:
    alias: Outdoor lights - turn a list on or off
    mode: parallel
    fields:
      list: { description: "input_text holding the entity list" }
      turn_on: { description: "true = on, false = off" }
    sequence:
      - variables:
          ids: "{{ states(list).split(',') | map('trim') | select('match', '^(light|switch)\\.') | list }}"
      - condition: template
        value_template: "{{ ids | count > 0 }}"
      - if: "{{ turn_on }}"
        then:
          - action: homeassistant.turn_on
            target: { entity_id: "{{ ids }}" }
        else:
          - action: homeassistant.turn_off
            target: { entity_id: "{{ ids }}" }

automation:
  # First start only: fill in the starting values. After that your changes are kept.
  - id: fh_outdoor_defaults
    alias: "Outdoor: fill in starting values (first install only)"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: not
        conditions: [{ condition: state, entity_id: input_boolean.fh_outdoor_ready, state: "on" }]
    actions:
      - action: input_text.set_value
        target: { entity_id: input_text.fh_outdoor_night_lights }
        data: { value: "light.front_porch_light,light.driveway_light,light.garage_side_door_entry_light" }
      - action: input_text.set_value
        target: { entity_id: input_text.fh_outdoor_holiday_lights }
        data: { value: "switch.exterior_lights_smart_plug" }
      - action: input_text.set_value
        target: { entity_id: input_text.fh_outdoor_window_lights }
        data: { value: "switch.upstairs_smart_plug_1,switch.smart_plug_2,switch.smart_plug_3" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.fh_outdoor_switchover }
        data: { time: "23:50:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.fh_outdoor_windows_off }
        data: { time: "22:30:00" }
      - action: input_number.set_value
        target: { entity_id: input_number.fh_outdoor_xmas_last_day }
        data: { value: 6 }
      - action: input_boolean.turn_on
        target: { entity_id: [input_boolean.fh_outdoor_halloween, input_boolean.fh_outdoor_christmas, input_boolean.fh_outdoor_ready] }

  - id: fh_outdoor_sunset
    alias: "Outdoor: sunset"
    triggers:
      - trigger: sun
        event: sunset
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.holiday_lights_season
            state: "on"
        then:
          - action: script.fh_outdoor_set
            data: { list: input_text.fh_outdoor_holiday_lights, turn_on: true }
        else:
          - action: script.fh_outdoor_set
            data: { list: input_text.fh_outdoor_night_lights, turn_on: true }

  - id: fh_outdoor_1150
    alias: "Outdoor: holiday lights off, nightly lights on"
    triggers:
      - trigger: time
        at: input_datetime.fh_outdoor_switchover
    conditions:            # any holiday light on (still true after midnight on the season's last night)
      - condition: template
        value_template: "{{ states('input_text.fh_outdoor_holiday_lights').split(',') | map('trim') | select('is_state', 'on') | list | count > 0 }}"
    actions:
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_holiday_lights, turn_on: false }
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_night_lights, turn_on: true }

  # Holiday season starts after dark (e.g. "Turn them on tonight anyway"): switch over right away
  - id: fh_outdoor_holiday_now
    alias: "Outdoor: holiday lights on now (season started after sunset)"
    triggers:
      - trigger: state
        entity_id: binary_sensor.holiday_lights_season
        to: "on"
    conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: template
        value_template: "{{ now().strftime('%H:%M') < states('input_datetime.fh_outdoor_switchover')[:5] }}"
    actions:
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_holiday_lights, turn_on: true }

  - id: fh_outdoor_sunrise
    alias: "Outdoor: everything off at sunrise"
    triggers:
      - trigger: sun
        event: sunrise
    actions:
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_night_lights, turn_on: false }
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_holiday_lights, turn_on: false }

  - id: fh_christmas_upstairs_on
    alias: "Christmas: window lights on at sunset"
    triggers:
      - trigger: sun
        event: sunset
    conditions:
      - condition: state
        entity_id: binary_sensor.christmas_season
        state: "on"
    actions:
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_window_lights, turn_on: true }

  - id: fh_christmas_upstairs_off
    alias: "Christmas: window lights off"
    triggers:
      - trigger: time
        at: input_datetime.fh_outdoor_windows_off
    conditions:
      - condition: state
        entity_id: binary_sensor.christmas_season
        state: "on"
    actions:
      - action: script.fh_outdoor_set
        data: { list: input_text.fh_outdoor_window_lights, turn_on: false }
