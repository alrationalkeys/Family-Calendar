# FamilyHub — thermostats: the daily schedule + Santee Cooper peak hours, all in one place (Nov 2026)
#
# FamilyHub runs the thermostats now; the Alarm.com thermostat schedule is switched OFF once and never
# edited again. Change everything on the phone: FamilyHub > Settings > Automations > Thermostats.
#
#   Daily schedule   Day (9 AM–6 PM): heat 60 / cool 70.   Night (6 PM–9 AM): heat 67 / cool 70.
#   Peak hours       Santee Cooper bills on DEMAND: one HVAC run during peak sets an expensive charge for the
#                    month, so during peak the heat and AC are OFF. Winter (Nov–Mar) 6–9 AM, summer (Apr–Oct)
#                    3–6 PM, every day. An hour before, it pre-heats (70) or pre-cools (68) while power is cheap.
#                    When peak ends, both come back on in the mode they were in, at the schedule's temperatures.
#   Safety           if the house reaches 50 (pipes) or 88 during peak, that thermostat comes back on.
#
# Starting values are filled in once (fh_peak_defaults / fh_sched_defaults); after that your changes are kept.
# INSTALL: put this file in the packages folder (/homeassistant/packages in the Terminal add-on), restart,
# then in the Alarm.com app turn the thermostat SCHEDULE off on both thermostats (no editing needed).

input_datetime:
  peak_summer_start: { name: Peak summer start, has_date: false, has_time: true }
  peak_summer_end:   { name: Peak summer end,   has_date: false, has_time: true }
  peak_winter_start: { name: Peak winter start, has_date: false, has_time: true }
  peak_winter_end:   { name: Peak winter end,   has_date: false, has_time: true }
  sched_day_start:   { name: Day starts at,     has_date: false, has_time: true }
  sched_night_start: { name: Night starts at,   has_date: false, has_time: true }

input_number:
  peak_preheat:   { name: Pre-heat before winter peak, min: 60, max: 76, step: 1, unit_of_measurement: "°F" }
  peak_precool:   { name: Pre-cool before summer peak, min: 64, max: 78, step: 1, unit_of_measurement: "°F" }
  peak_safe_low:  { name: Peak safety floor (heat comes back on), min: 40, max: 60, step: 1, unit_of_measurement: "°F" }
  peak_safe_high: { name: Peak safety ceiling (AC comes back on), min: 80, max: 95, step: 1, unit_of_measurement: "°F" }
  sched_day_heat:   { name: Day heat,   min: 50, max: 78, step: 1, unit_of_measurement: "°F" }
  sched_day_cool:   { name: Day cool,   min: 62, max: 90, step: 1, unit_of_measurement: "°F" }
  sched_night_heat: { name: Night heat, min: 50, max: 78, step: 1, unit_of_measurement: "°F" }
  sched_night_cool: { name: Night cool, min: 62, max: 90, step: 1, unit_of_measurement: "°F" }

input_text:
  peak_saved: { name: Saved thermostat settings (automatic), max: 255 }

input_boolean:
  peak_enabled:  { name: Turn heat and AC off during peak, icon: mdi:transmission-tower }
  sched_enabled: { name: FamilyHub runs the daily schedule, icon: mdi:thermostat-auto }
  peak_active:   { name: Peak in progress (automatic) }
  peak_ready:    { name: Peak starting values filled in (automatic) }
  sched_ready:   { name: Schedule starting values filled in (automatic) }

template:
  - binary_sensor:
      - name: Peak summer season
        unique_id: fh_peak_summer_season
        state: "{{ 4 <= now().month <= 10 }}"
      - name: Santee Cooper peak now
        unique_id: fh_peak_now
        state: >
          {% set s = is_state('binary_sensor.peak_summer_season','on') %}
          {% set a = states('input_datetime.peak_summer_start' if s else 'input_datetime.peak_winter_start')[:5] %}
          {% set b = states('input_datetime.peak_summer_end' if s else 'input_datetime.peak_winter_end')[:5] %}
          {{ a <= now().strftime('%H:%M') < b }}

script:
  # Set the thermostats to the schedule's temperatures for the current time of day, in whatever mode each is in
  # (heat -> heat temp, cool -> cool temp, heat/cool or auto -> both). A thermostat that's off is left off.
  fh_thermostat_schedule:
    alias: Thermostats - apply the daily schedule
    mode: queued
    fields:
      entities: { description: "thermostats (default: both)" }
    sequence:
      - variables:
          ids: "{{ entities if entities is defined and entities else ['climate.upstairs_thermostat', 'climate.downstairs_thermostat'] }}"
          day: >
            {% set n = now().strftime('%H:%M') %}
            {{ states('input_datetime.sched_day_start')[:5] <= n < states('input_datetime.sched_night_start')[:5] }}
          h: "{{ states('input_number.sched_day_heat' if day else 'input_number.sched_night_heat') | float(65) }}"
          c: "{{ states('input_number.sched_day_cool' if day else 'input_number.sched_night_cool') | float(72) }}"
      - repeat:
          for_each: "{{ ids if ids is list else [ids] }}"
          sequence:
            - variables:
                mode: "{{ states(repeat.item) }}"
            - choose:
                - conditions: "{{ mode in ['heat_cool', 'auto'] }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { target_temp_low: "{{ h }}", target_temp_high: "{{ c }}" }
                - conditions: "{{ mode == 'heat' }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { temperature: "{{ h }}" }
                - conditions: "{{ mode == 'cool' }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { temperature: "{{ c }}" }

automation:
  # First start only: fill in the starting values. After that your changes are kept.
  - id: fh_peak_defaults
    alias: "Peak: fill in starting values (first install only)"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: not
        conditions: [{ condition: state, entity_id: input_boolean.peak_ready, state: "on" }]
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.peak_summer_start }
        data: { time: "15:00:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.peak_summer_end }
        data: { time: "18:00:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.peak_winter_start }
        data: { time: "06:00:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.peak_winter_end }
        data: { time: "09:00:00" }
      - repeat:
          for_each:
            - { e: input_number.peak_preheat, v: 70 }
            - { e: input_number.peak_precool, v: 68 }
            - { e: input_number.peak_safe_low, v: 50 }
            - { e: input_number.peak_safe_high, v: 88 }
          sequence:
            - action: input_number.set_value
              target: { entity_id: "{{ repeat.item.e }}" }
              data: { value: "{{ repeat.item.v }}" }
      - action: input_boolean.turn_on
        target: { entity_id: [input_boolean.peak_enabled, input_boolean.peak_ready] }

  - id: fh_sched_defaults
    alias: "Schedule: fill in starting values (first install only)"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: not
        conditions: [{ condition: state, entity_id: input_boolean.sched_ready, state: "on" }]
    actions:
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.sched_day_start }
        data: { time: "09:00:00" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.sched_night_start }
        data: { time: "18:00:00" }
      - repeat:
          for_each:
            - { e: input_number.sched_day_heat, v: 60 }
            - { e: input_number.sched_day_cool, v: 70 }
            - { e: input_number.sched_night_heat, v: 67 }
            - { e: input_number.sched_night_cool, v: 70 }
          sequence:
            - action: input_number.set_value
              target: { entity_id: "{{ repeat.item.e }}" }
              data: { value: "{{ repeat.item.v }}" }
      - action: input_boolean.turn_on
        target: { entity_id: [input_boolean.sched_enabled, input_boolean.sched_ready] }

  # Daily schedule: at the day / night start times (not during peak — the end of peak applies it instead)
  - id: fh_sched_apply
    alias: "Schedule: day / night temperatures"
    triggers:
      - trigger: time
        at: input_datetime.sched_day_start
      - trigger: time
        at: input_datetime.sched_night_start
    conditions:
      - condition: state
        entity_id: input_boolean.sched_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.peak_active
        state: "off"
    actions:
      - action: script.fh_thermostat_schedule

  - id: fh_peak_precondition
    alias: "Peak: pre-heat / pre-cool an hour before"
    triggers:
      - trigger: template
        value_template: >
          {% set st = states('input_datetime.peak_summer_start' if is_state('binary_sensor.peak_summer_season','on') else 'input_datetime.peak_winter_start') %}
          {{ now().strftime('%H:%M') == (today_at(st) - timedelta(hours=1)).strftime('%H:%M') }}
    conditions:
      - condition: state
        entity_id: input_boolean.peak_enabled
        state: "on"
    actions:
      - repeat:
          for_each: [climate.upstairs_thermostat, climate.downstairs_thermostat]
          sequence:
            - variables:
                summer: "{{ is_state('binary_sensor.peak_summer_season','on') }}"
                mode: "{{ states(repeat.item) }}"
            - choose:
                - conditions: "{{ mode in ['heat_cool','auto'] }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: >
                        {% if summer %}{"target_temp_low": {{ state_attr(repeat.item,'target_temp_low') or 60 }}, "target_temp_high": {{ states('input_number.peak_precool') }}}
                        {% else %}{"target_temp_low": {{ states('input_number.peak_preheat') }}, "target_temp_high": {{ [state_attr(repeat.item,'target_temp_high') or 75, (states('input_number.peak_preheat')|float) + 3] | max }}}{% endif %}
                - conditions: "{{ mode == 'heat' and not summer }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { temperature: "{{ states('input_number.peak_preheat') }}" }
                - conditions: "{{ mode == 'cool' and summer }}"
                  sequence:
                    - action: climate.set_temperature
                      target: { entity_id: "{{ repeat.item }}" }
                      data: { temperature: "{{ states('input_number.peak_precool') }}" }

  # Fires at peak start, and also catches up if Home Assistant was restarting at that moment
  # (start event + a check every 5 min). peak_active makes sure it only runs once per peak.
  - id: fh_peak_start
    alias: "Peak: HVAC off"
    triggers:
      - trigger: state
        entity_id: binary_sensor.santee_cooper_peak_now
        to: "on"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: binary_sensor.santee_cooper_peak_now
        state: "on"
      - condition: state
        entity_id: input_boolean.peak_active
        state: "off"
      - condition: state
        entity_id: input_boolean.peak_enabled
        state: "on"
    actions:
      # remember each thermostat's mode + temperatures, then turn both off
      - action: input_text.set_value
        target: { entity_id: input_text.peak_saved }
        data:
          value: >
            {% set ns = namespace(o={}) %}
            {% for e in ['climate.upstairs_thermostat','climate.downstairs_thermostat'] %}
              {% set ns.o = dict(ns.o, **{e.split('.')[1][:4]: [states(e), state_attr(e,'temperature'), state_attr(e,'target_temp_low'), state_attr(e,'target_temp_high')]}) %}
            {% endfor %}
            {{ ns.o | to_json }}
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.peak_active }
      - action: climate.set_hvac_mode
        target: { entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat] }
        data: { hvac_mode: "off" }

  - id: fh_peak_end
    alias: "Peak: HVAC back on"
    triggers:
      - trigger: state
        entity_id: binary_sensor.santee_cooper_peak_now
        to: "off"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: binary_sensor.santee_cooper_peak_now
        state: "off"
      - condition: state
        entity_id: input_boolean.peak_active
        state: "on"
    actions:
      - repeat:
          for_each:
            - { e: climate.upstairs_thermostat, k: upst }
            - { e: climate.downstairs_thermostat, k: down }
          sequence:
            - variables:
                s: "{{ (states('input_text.peak_saved') | from_json({})).get(repeat.item.k, ['heat_cool', none, none, none]) }}"
            - variables:
                mode: "{{ s[0] if s[0] not in ['unavailable','unknown', none] else 'heat_cool' }}"
            - if: "{{ mode != 'off' }}"          # it was off before peak: leave it off
              then:
                - action: climate.set_hvac_mode
                  target: { entity_id: "{{ repeat.item.e }}" }
                  data: { hvac_mode: "{{ mode }}" }
                - wait_template: "{{ is_state(repeat.item.e, mode) }}"   # Alarm.com can take a while to report the new mode
                  timeout: 60
                  continue_on_timeout: true
                - if:
                    - condition: state
                      entity_id: input_boolean.sched_enabled
                      state: "on"
                  then:   # back to the schedule's temperatures for this time of day
                    - action: script.fh_thermostat_schedule
                      data: { entities: ["{{ repeat.item.e }}"] }
                  else:   # no schedule: back to exactly what it was before peak
                    - choose:
                        - conditions: "{{ mode in ['heat_cool','auto'] and s[2] and s[3] }}"
                          sequence:
                            - action: climate.set_temperature
                              target: { entity_id: "{{ repeat.item.e }}" }
                              data: { target_temp_low: "{{ s[2] }}", target_temp_high: "{{ s[3] }}" }
                        - conditions: "{{ mode in ['heat','cool'] and s[1] }}"
                          sequence:
                            - action: climate.set_temperature
                              target: { entity_id: "{{ repeat.item.e }}" }
                              data: { temperature: "{{ s[1] }}" }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.peak_active }

  # During peak, if a thermostat comes back on (someone at the wall, the Alarm.com app, a cloud blip at 6:00),
  # turn it off again — unless the safety limit below is what turned it on.
  - id: fh_peak_enforce
    alias: "Peak: keep heat and AC off"
    triggers:
      - trigger: state
        entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat]
        not_to: ["off", "unavailable", "unknown"]
        for: { seconds: 30 }
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.peak_active
        state: "on"
    actions:
      - repeat:
          for_each: [climate.upstairs_thermostat, climate.downstairs_thermostat]
          sequence:
            - variables:
                t: "{{ state_attr(repeat.item, 'current_temperature') | float(70) }}"
            - if:
                - "{{ states(repeat.item) not in ['off', 'unavailable', 'unknown'] }}"
                - "{{ (states('input_number.peak_safe_low') | float(50)) < t < (states('input_number.peak_safe_high') | float(88)) }}"
              then:
                - action: climate.set_hvac_mode
                  target: { entity_id: "{{ repeat.item }}" }
                  data: { hvac_mode: "off" }

  # Safety only — pipes / extreme heat. Should never fire on a normal day.
  - id: fh_peak_safety
    alias: "Peak: safety limit reached, turn that thermostat back on"
    triggers:
      - trigger: numeric_state
        entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat]
        attribute: current_temperature
        below: input_number.peak_safe_low
      - trigger: numeric_state
        entity_id: [climate.upstairs_thermostat, climate.downstairs_thermostat]
        attribute: current_temperature
        above: input_number.peak_safe_high
    conditions:
      - condition: state
        entity_id: input_boolean.peak_active
        state: "on"
    actions:
      - variables:
          cold: "{{ (state_attr(trigger.entity_id,'current_temperature')|float) < (states('input_number.peak_safe_low')|float) }}"
      - action: climate.set_hvac_mode
        target: { entity_id: "{{ trigger.entity_id }}" }
        data: { hvac_mode: "{{ 'heat' if cold else 'cool' }}" }
      - action: climate.set_temperature
        target: { entity_id: "{{ trigger.entity_id }}" }
        data: { temperature: "{{ states('input_number.peak_safe_low') if cold else states('input_number.peak_safe_high') }}" }
