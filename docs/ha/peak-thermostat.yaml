# FamilyHub — Santee Cooper peak hours on both thermostats, automatically, all year (Nov 2026)
#
# Santee Cooper peak, every day:  winter (Nov 1 – Mar 31) 6–9 AM,  summer (Apr 1 – Oct 31) 3–6 PM.
#
# HOW IT WORKS
#   Alarm.com keeps ONE comfort schedule year-round with no peak blocks in it (see below).
#   At peak start Home Assistant remembers each thermostat's settings and switches to the peak settings:
#       winter peak: heat 60°, cool 85°        summer peak: heat 50°, cool 78°
#   (the winter numbers + the summer heat number are the ones already in your Alarm.com schedule)
#   Summer only: an hour before peak it pre-cools 2° so the house rides through 3–6 PM.
#   At peak end it puts both thermostats back exactly where they were; the Alarm.com schedule carries on.
#   Works whether a thermostat is in Heat, Cool or Auto (heat + cool setpoints).
#   Change any number or time in Home Assistant: Settings > Devices & services > Helpers > "Peak …".
#
# ALARM.COM SCHEDULE TO SET ONCE (both thermostats, weekday + weekend the same), then never touch it again:
#       Heat: 67° from 6 PM to 9 AM, 60° from 9 AM to 6 PM        (just delete the 50° 3–6 PM block)
#       Cool: 70° all day                                          (just delete the 85° 6–9 AM block)
#
# INSTALL: check the two thermostat entity IDs (Settings > Entities, search "thermostat"), put this file in
# /config/packages/, restart, then simplify the Alarm.com schedule as above.

input_datetime:
  peak_summer_start: { name: Peak summer start, has_date: false, has_time: true, initial: "15:00" }
  peak_summer_end:   { name: Peak summer end,   has_date: false, has_time: true, initial: "18:00" }
  peak_winter_start: { name: Peak winter start, has_date: false, has_time: true, initial: "06:00" }
  peak_winter_end:   { name: Peak winter end,   has_date: false, has_time: true, initial: "09:00" }

input_number:
  peak_winter_heat: { name: Peak winter heat, min: 45, max: 75, step: 1, initial: 60, unit_of_measurement: "°F" }
  peak_winter_cool: { name: Peak winter cool, min: 70, max: 90, step: 1, initial: 85, unit_of_measurement: "°F" }
  peak_summer_heat: { name: Peak summer heat, min: 45, max: 75, step: 1, initial: 50, unit_of_measurement: "°F" }
  peak_summer_cool: { name: Peak summer cool, min: 70, max: 90, step: 1, initial: 78, unit_of_measurement: "°F" }
  peak_precool:     { name: Summer pre-cool an hour before (degrees, 0 = off), min: 0, max: 4, step: 1, initial: 2 }
  # remembered settings (filled in automatically)
  peak_saved_up_heat:   { name: Saved upstairs heat,   min: 40, max: 95, step: 0.5, mode: box }
  peak_saved_up_cool:   { name: Saved upstairs cool,   min: 40, max: 95, step: 0.5, mode: box }
  peak_saved_down_heat: { name: Saved downstairs heat, min: 40, max: 95, step: 0.5, mode: box }
  peak_saved_down_cool: { name: Saved downstairs cool, min: 40, max: 95, step: 0.5, mode: box }

input_boolean:
  peak_enabled: { name: Peak-hour thermostat changes, icon: mdi:transmission-tower, initial: true }
  peak_active:  { name: Peak in progress (automatic) }

template:
  - binary_sensor:
      - name: Peak summer season
        unique_id: fh_peak_summer_season
        state: "{{ 4 <= now().month <= 10 }}"

script:
  # Set one thermostat to (heat, cool), whatever mode it's in.
  fh_thermo_set:
    alias: Set a thermostat's heat/cool targets
    fields:
      entity: {}
      heat: {}
      cool: {}
    sequence:
      - choose:
          - conditions: "{{ states(entity) in ['heat_cool', 'auto'] }}"
            sequence:
              - action: climate.set_temperature
                target: { entity_id: "{{ entity }}" }
                data: { target_temp_low: "{{ heat }}", target_temp_high: "{{ cool }}" }
          - conditions: "{{ states(entity) == 'heat' }}"
            sequence:
              - action: climate.set_temperature
                target: { entity_id: "{{ entity }}" }
                data: { temperature: "{{ heat }}" }
          - conditions: "{{ states(entity) == 'cool' }}"
            sequence:
              - action: climate.set_temperature
                target: { entity_id: "{{ entity }}" }
                data: { temperature: "{{ cool }}" }

automation:
  - id: fh_peak_precool
    alias: "Peak: summer pre-cool an hour before"
    triggers:
      - trigger: template
        value_template: >
          {{ now().strftime('%H:%M') == (today_at(states('input_datetime.peak_summer_start')) - timedelta(hours=1)).strftime('%H:%M') }}
    conditions:
      - condition: state
        entity_id: [input_boolean.peak_enabled, binary_sensor.peak_summer_season]
        state: "on"
      - condition: numeric_state
        entity_id: input_number.peak_precool
        above: 0
    actions:
      - repeat:
          for_each: [climate.upstairs_thermostat, climate.downstairs_thermostat]
          sequence:
            - variables:
                d: "{{ states('input_number.peak_precool') | float }}"
                lo: "{{ state_attr(repeat.item, 'target_temp_low') or state_attr(repeat.item, 'temperature') }}"
                hi: "{{ state_attr(repeat.item, 'target_temp_high') or state_attr(repeat.item, 'temperature') }}"
            - condition: template
              value_template: "{{ hi is number and states(repeat.item) in ['cool', 'heat_cool', 'auto'] }}"
            - action: script.fh_thermo_set
              data: { entity: "{{ repeat.item }}", heat: "{{ lo }}", cool: "{{ hi - d }}" }

  - id: fh_peak_start
    alias: "Peak: switch to peak settings"
    triggers:
      - trigger: template
        value_template: >
          {% set st = states('input_datetime.peak_summer_start' if is_state('binary_sensor.peak_summer_season','on') else 'input_datetime.peak_winter_start') %}
          {{ now().strftime('%H:%M') == st[:5] }}
    conditions:
      - condition: state
        entity_id: input_boolean.peak_enabled
        state: "on"
    variables:
      summer: "{{ is_state('binary_sensor.peak_summer_season', 'on') }}"
      pre: "{{ (states('input_number.peak_precool') | float) if summer else 0 }}"
      ph: "{{ states('input_number.peak_summer_heat' if summer else 'input_number.peak_winter_heat') | float }}"
      pc: "{{ states('input_number.peak_summer_cool' if summer else 'input_number.peak_winter_cool') | float }}"
    actions:
      # remember the normal settings (undo the pre-cool so after-peak goes back to the real schedule value)
      - repeat:
          for_each:
            - { e: climate.upstairs_thermostat,   h: input_number.peak_saved_up_heat,   c: input_number.peak_saved_up_cool }
            - { e: climate.downstairs_thermostat, h: input_number.peak_saved_down_heat, c: input_number.peak_saved_down_cool }
          sequence:
            - action: input_number.set_value
              target: { entity_id: "{{ repeat.item.h }}" }
              data: { value: "{{ state_attr(repeat.item.e, 'target_temp_low') or state_attr(repeat.item.e, 'temperature') or 67 }}" }
            - action: input_number.set_value
              target: { entity_id: "{{ repeat.item.c }}" }
              data: { value: "{{ (state_attr(repeat.item.e, 'target_temp_high') or state_attr(repeat.item.e, 'temperature') or 70) + pre }}" }
            - action: script.fh_thermo_set
              data: { entity: "{{ repeat.item.e }}", heat: "{{ ph }}", cool: "{{ pc }}" }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.peak_active }

  - id: fh_peak_end
    alias: "Peak: back to normal"
    triggers:
      - trigger: template
        value_template: >
          {% set en = states('input_datetime.peak_summer_end' if is_state('binary_sensor.peak_summer_season','on') else 'input_datetime.peak_winter_end') %}
          {{ now().strftime('%H:%M') == en[:5] }}
    conditions:
      - condition: state
        entity_id: input_boolean.peak_active
        state: "on"
    actions:
      - action: script.fh_thermo_set
        data: { entity: climate.upstairs_thermostat, heat: "{{ states('input_number.peak_saved_up_heat') }}", cool: "{{ states('input_number.peak_saved_up_cool') }}" }
      - action: script.fh_thermo_set
        data: { entity: climate.downstairs_thermostat, heat: "{{ states('input_number.peak_saved_down_heat') }}", cool: "{{ states('input_number.peak_saved_down_cool') }}" }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.peak_active }
